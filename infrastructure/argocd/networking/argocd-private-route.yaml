apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: argocd-server-private
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`argocd.istartit.com`)
      services:
        - name: argocd-server
          port: 443
  tls:
    passthrough: true
