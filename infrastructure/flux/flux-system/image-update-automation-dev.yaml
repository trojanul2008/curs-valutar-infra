apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: curs-flask-dev-autoupdate
  namespace: flux-system
spec:
  interval: 5m
  checkout:
    gitRepositoryRef:
      name: flux-system
    branch: dev
  commit:
    author:
      name: fluxcdbot
      email: fluxcdbot@example.com
    messageTemplate: >-
      chore: update curs-flask dev image to
      {{ range .Updates }} {{ .NewName }}:{{ .NewTag }}{{ end }}
  update:
    path: infrastructure/k8s/overlays/dev
    strategy: Setters

