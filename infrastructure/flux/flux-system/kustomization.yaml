apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/flux/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # apply the components first
  dependsOn:
    - name: flux-system
      kind: GitRepository

