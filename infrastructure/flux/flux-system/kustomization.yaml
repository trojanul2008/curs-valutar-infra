apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minimal Flux platform composition for bootstrap and recovery.
# Application-specific curs-valutar resources are owned by Argo CD and
# must not be included in this composition.

resources:
  - manifests/flux-controllers.yaml
  - manifests/flux-system-sync.yaml
  - manifests/external-secrets-install.yaml
