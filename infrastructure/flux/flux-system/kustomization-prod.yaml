apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: curs-valutar-prod
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/k8s/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: prod
  wait: true
  timeout: 3m
  dependsOn:
    - name: flux-system

