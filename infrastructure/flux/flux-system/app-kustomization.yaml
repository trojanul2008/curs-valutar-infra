apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: curs-valutar
  namespace: flux-system
spec:
  interval: 5m
  path: "./infrastructure/k8s"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: curs-flask
      namespace: default  # Ensure this is 'default'
