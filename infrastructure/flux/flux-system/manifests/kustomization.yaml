apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/flux/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  resources:
    - gotk-sync.yaml
    - image-repository.yaml
    - image-policy-dev.yaml
    - image-policy.yaml
    - image-update-automation-dev.yaml
    - image-update-automation.yaml
    - app-kustomization.yaml

