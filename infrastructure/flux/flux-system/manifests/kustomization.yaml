apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-prod
  resources:
    - gotk-sync.yaml              # infra-prod
    - gotk-components.yaml        # Kustomization of Flux controllers
    - image-repository.yaml
    - image-policy-dev.yaml
    - image-policy.yaml
    - image-update-automation-dev.yaml
    - image-update-automation.yaml
    - source-dev.yaml             # infra-dev
    - external-secrets-install.yaml
    - app-kustomization.yaml
