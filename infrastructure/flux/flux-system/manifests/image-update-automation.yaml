apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: curs-valutar-autoupdate
  namespace: flux-system
spec:
  interval: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system

  git:
    checkout:
      # Prod releases live on the 'main' (or 'prod') branch:
      ref:
        branch: prod

    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@example.com
      # Use the exact updated image tag in commit message:
      messageTemplate: "chore: promote curs-valutar-app to {{ .UpdatedImage }}"

  update:
    # Path to your prod Kustomize overlay:
    path: infrastructure/k8s/overlays/prod
    strategy: Setters

