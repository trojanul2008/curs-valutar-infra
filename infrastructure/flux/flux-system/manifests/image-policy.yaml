apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: curs-valutar-prod-policy
  namespace: flux-system
spec:
  # Point at the shared ImageRepository
  imageRepositoryRef:
    name: curs-valutar-repo

  # Only pick tags matching a SemVer pattern (e.g. v1.2.3)
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    extract: '$0'

  # Choose the highest version according to semver (alphabetical works for vX.Y.Z)
  policy:
    alphabetical:
      order: asc

