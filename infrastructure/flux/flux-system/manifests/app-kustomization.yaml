apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: curs-valutar-dev
  namespace: flux-system
spec:
  interval: 5m
  path: infrastructure/k8s/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-dev
  targetNamespace: dev
  dependsOn:
    - name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: curs-valutar
      namespace: dev

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: curs-valutar-prod
  namespace: flux-system
spec:
  interval: 5m
  path: infrastructure/k8s/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-prod
  targetNamespace: prod
  dependsOn:
    - name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: curs-valutar
      namespace: prod
