apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1h
  timeout: 2m
  url: https://github.com/trojanul2008/curs-valutar-infra.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1h
  timeout: 2m
  path: ./infrastructure/flux/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
