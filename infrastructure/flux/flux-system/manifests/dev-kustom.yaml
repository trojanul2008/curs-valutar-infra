apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-kustom
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/flux/flux-system/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-dev
  targetNamespace: dev
  validation: client
