apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: istartit
  namespace: flux-system
spec:
  interval: 1m
  timeout: 60s
  url: https://github.com/trojanul2008/istartit.git
  ref:
    branch: main
  secretRef:
    name: istartit-flux-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istartit-platform
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/flux/istartit
  prune: true
  sourceRef:
    kind: GitRepository
    name: istartit
  timeout: 2m
  wait: true
