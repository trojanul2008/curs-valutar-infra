apiVersion: apps/v1
kind: Deployment
metadata:
  name: curs-flask
  labels:
    app: curs-flask
    env: production
    version: v1.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: curs-flask
  template:
    metadata:
      labels:
        app: curs-flask
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: curs-flask
          image: REPLACE_ME
          imagePullPolicy: Always

          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true

          ports:
            - containerPort: 5000

          env:
            - name: FLASK_ENV
              value: "production"
            - name: HISTORY_DAYS
              value: "5"
            - name: REQUEST_TIMEOUT
              value: "10"
            - name: RATE_LIMIT
              value: "3/60"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 1

          volumeMounts:
            - name: config-volume
              mountPath: /app/curs_valutar/templates/healthcheck.sh
              subPath: healthcheck.sh
              readOnly: true

      volumes:
        - name: config-volume
          configMap:
            name: healthcheck-script
            defaultMode: 0777

