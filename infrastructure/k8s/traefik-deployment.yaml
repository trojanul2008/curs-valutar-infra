apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      # Pod‑wide security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532      # nobody
      containers:
        - name: traefik
          image: traefik:latest    # adjust to your desired tag
          # Container‑level hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532        # nobody
          ports:
            - containerPort: 80
            - containerPort: 443
