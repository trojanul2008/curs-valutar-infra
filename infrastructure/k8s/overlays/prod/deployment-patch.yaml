apiVersion: apps/v1
kind: Deployment
metadata:
  name: curs-flask
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: curs-flask
          image: trojanul2008/curs-flask:prod-latest
          env:
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

