apiVersion: apps/v1
kind: Deployment
metadata:
  name: curs-flask
spec:
  template:
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: curs-flask
        # Use specific tag instead of 'latest'
        image: trojanul2008/curs-flask:dev
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        env:
        - name: FLASK_ENV
          value: "development"
        - name: FLASK_APP
          value: "curs_valutar:create_app"
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
            ephemeral-storage: "100Mi"
          limits:
            memory: "128Mi"
            ephemeral-storage: "200Mi"
