apiVersion: apps/v1
kind: Deployment
metadata:
  name: curs-flask
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000

      containers:
      - name: curs-flask
        image: trojanul2008/curs-flask:dev-latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - name: FLASK_ENV
          value: "development"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"

