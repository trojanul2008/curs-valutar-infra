apiVersion: apps/v1
kind: Deployment
metadata:
  name: curs-valutar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curs-valutar
  template:
    spec:
      imagePullSecrets:
        - name: docker-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curs-valutar
          image: trojanul2008/curs-valutar-app:dev-20250731
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          env:
            - name: FLASK_ENV
              value: "development"
            - name: FLASK_APP
              value: "curs_valutar:create_app"
            - name: PYTHONPATH
              value: "/app"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "128Mi"
              cpu: "200m"
              ephemeral-storage: "200Mi"
