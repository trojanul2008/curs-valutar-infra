apiVersion: apps/v1
kind: Deployment
metadata:
  name: curs-valutar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curs-valutar
  template:
    spec:
      # Ensure processes can write to mounted emptyDir
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp-dir
          emptyDir: {}
      containers:
        - name: curs-valutar
          image: trojanul2008/curs-valutar-app:dev-20250731
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: tmp-dir
              mountPath: /var/tmp
            - name: tmp-dir
              mountPath: /usr/tmp
          env:
            - name: FLASK_ENV
              value: "development"
            - name: FLASK_APP
              value: "curs_valutar:create_app"
            - name: PYTHONPATH
              value: "/app"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "128Mi"
              cpu: "200m"
              ephemeral-storage: "200Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 1
      automountServiceAccountToken: false
