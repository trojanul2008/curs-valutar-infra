apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

# Încarcă tot din base (deployment.yaml, service.yaml, ingress.yaml, configMapGenerator)
resources:
  - ../../base

# Aplică întâi patch‑ul de deployment, apoi cel de ingress
patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml

