apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
  - serviceaccount.yaml
patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
  - path: remove-affinity-patch.yaml
  - path: service-account-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: curs-valutar
  - path: network-policy-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-cross-namespace
images:
  - name: trojanul2008/curs-valutar-app
    newName: trojanul2008/curs-valutar-app
    digest: sha256:1ff9219a181600d9d6e82d88d237d452b05fabeba49bc285f4ec9f67b7af7957
