apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curs-valutar-ingress  # Changed to match base resource name
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  tls: []
  rules:
    - host: di-exchange.istartit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: curs-valutar
                port:
                  number: 80
