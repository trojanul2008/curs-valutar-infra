# flux-bootstrap-sa.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-bootstrap
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-bootstrap-binding
subjects:
  - kind: ServiceAccount
    name: flux-bootstrap
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
