name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev

jobs:
  k8s-lint:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Kustomize
        run: |
          curl -s \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.4"
          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download"
          KUBECONFORM_URL+="/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -L "$KUBECONFORM_URL" -o kubeconform.tar.gz
          tar xzf kubeconform.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz

      - name: Lint YAML files
        run: |
          pip3 install yamllint
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

      - name: Install Kyverno CLI
        run: |
          KYVERNO_VERSION="v1.12.4"
          KYVERNO_URL="https://github.com/kyverno/kyverno/releases/download/"
          KYVERNO_URL+="${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}"
          KYVERNO_URL+="_linux_x86_64.tar.gz"
          curl -sSfL "$KYVERNO_URL" | tar xz -C /usr/local/bin kyverno

      - name: Test Kyverno policies
        run: |
          kustomize build infrastructure/k8s/base > base-manifests.yaml
          kyverno apply infrastructure/kyverno/ \
            --resource base-manifests.yaml \
            --output json > kyverno-results.json || true

          # Check if any failures exist
          if jq -e '.failed | length > 0' kyverno-results.json; then
            echo "❌ Kyverno policy violations detected:"
            jq -r '.failed[] | "RESOURCE: \(.resource.kind)/\(.resource.name) | POLICY: \(.policy) | RULE: \(.rule)"' kyverno-results.json
            exit 1
          else
            echo "✅ All Kyverno policies passed"
          fi

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan container images
        run: |
          # Create scan helper script
          cat <<EOF > scan-images.sh
          #!/bin/bash
          set -euo pipefail
          find infrastructure -name '*.yaml' -exec grep -E 'image: ' {} \; \
            | awk '{print \$2}' | sort | uniq \
            | while read -r image; do
                echo "Scanning \$image"
                trivy image --exit-code 1 --severity HIGH,CRITICAL "\$image"
              done
          EOF
          chmod +x scan-images.sh
          ./scan-images.sh

      - name: Install Chaos Mesh CRDs
        run: |
          kubectl apply -f https://mirrors.chaos-mesh.org/v2.6.1/crd.yaml

      - name: Validate base manifests
        run: |
          kustomize build infrastructure/k8s/base \
            | kubeconform -verbose

      - name: Validate dev overlay
        run: |
          kustomize build infrastructure/k8s/overlays/dev \
            | kubeconform -verbose

      - name: Validate prod overlay
        run: |
          kustomize build infrastructure/k8s/overlays/prod \
            | kubeconform -verbose

      - name: Install Flux CLI
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Check for configuration drift
        run: |
          # Generate manifests for comparison
          kustomize build infrastructure/k8s/overlays/dev > dev-manifests.yaml
          kustomize build infrastructure/k8s/overlays/prod > prod-manifests.yaml

          # Compare with cluster state
          flux diff kustomization curs-valutar-dev \
            --path infrastructure/k8s/overlays/dev \
            || echo "No drift detected in dev"
          flux diff kustomization curs-valutar-prod \
            --path infrastructure/k8s/overlays/prod \
            || echo "No drift detected in prod"
