name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev

env:
  KUSTOMIZE_VERSION: v5.0.2
  KUBECONFORM_VERSION: 0.6.4
  KYVERNO_VERSION: v1.12.4
  YQ_VERSION: v4.43.1

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Kustomize
        run: |
          KUSTOMIZE_URL="https://github.com/kubernetes-sigs/kustomize"
          KUSTOMIZE_URL+="/releases/download/kustomize%2F${{ env.KUSTOMIZE_VERSION }}"
          KUSTOMIZE_URL+="/kustomize_${{ env.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz"
          curl -sL "$KUSTOMIZE_URL" -o kustomize.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
      - name: Install Kubeconform
        run: |
          KUBECONFORM_URL="https://github.com/yannh/kubeconform"
          KUBECONFORM_URL+="/releases/download/v${{ env.KUBECONFORM_VERSION }}"
          KUBECONFORM_URL+="/kubeconform-linux-amd64.tar.gz"
          curl -sL "$KUBECONFORM_URL" -o kubeconform.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate base
        run: |
          kustomize build infrastructure/k8s/base | kubeconform -verbose
      - name: Validate dev overlay
        run: |
          kustomize build infrastructure/k8s/overlays/dev | kubeconform -verbose
      - name: Validate prod overlay
        run: |
          kustomize build infrastructure/k8s/overlays/prod | kubeconform -verbose

  policy:
    name: Kyverno Policy Check
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: ${{ env.KYVERNO_VERSION }}
      - name: Test Kyverno policies
        run: |
          kustomize build infrastructure/k8s/base > base-manifests.yaml
          kyverno apply infrastructure/kyverno/ \
            --resource base-manifests.yaml \
            --output json > kyverno-results.json || true

          if jq -e '.failed | length > 0' kyverno-results.json; then
            echo "❌ Kyverno policy violations detected:"
            jq -r '.failed[] | "RESOURCE: \(.resource.kind)/\(.resource.name)"' \
              kyverno-results.json
            jq -r '.failed[] | "POLICY: \(.policy) | RULE: \(.rule)"' \
              kyverno-results.json
            exit 1
          else
            echo "✅ All Kyverno policies passed"
          fi


  scan:
    name: Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy and yq
        run: |
          # Install yq for YAML parsing
          sudo wget "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

          # Install Trivy
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Scan container images
        run: |
          # Create debug-friendly scan script
          cat <<'EOF' > scan-images.sh
          #!/bin/bash
          set -euo pipefail
          # Initialize counters
          total_files=0
          files_with_images=0
          files_without_images=0
          invalid_yaml_files=0
          # Create report file
          report_file="image-scan-report.txt"
          echo "Image Scan Report - $(date)" > "$report_file"
          # Process all YAML files
          while IFS= read -r -d $'\0' file; do
            ((total_files++))
            file_entry="\n===== File: $file =====\n"
            # Skip non-YAML files
            if [[ ! "$file" =~ \.(yaml|yml)$ ]]; then
              file_entry+="Skipped: Not a YAML file\n"
              echo -e "$file_entry" >> "$report_file"
              continue
            fi
            # Check if valid YAML
            if ! yq eval 'document_index' "$file" >/dev/null 2>&1; then
              ((invalid_yaml_files++))
              file_entry+="Skipped: Invalid YAML format\n"
              echo -e "$file_entry" >> "$report_file"
              continue
            fi
            # Extract images
            images=$(
              yq eval \
                '.. | select(has("image")) | .image |
                select(. != null and . != "PLACEHOLDER")' \
                "$file" 2>/dev/null || true
            )
            # Process images if found
            if [ -n "$images" ]; then
              ((files_with_images++))
              file_entry+="Found images:\n"
              while IFS= read -r image; do
                if [ -n "$image" ]; then
                  file_entry+="- $image\n"
                fi
              done <<< "$images"
              echo -e "$file_entry" >> "$report_file"
              # Scan each image
              while IFS= read -r image; do
                if [ -n "$image" ]; then
                  echo "Scanning $image"
                  if ! trivy image --cache-dir /tmp/trivy-cache \
                    --exit-code 1 --severity HIGH,CRITICAL "$image"; then
                    echo "❌ Critical vulnerabilities found in $image"
                  fi
                fi
              done <<< "$images"
            else
              ((files_without_images++))
              file_entry+="No valid images found in this file\n"
              echo -e "$file_entry" >> "$report_file"
            fi
          done < <(find infrastructure -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
          # Generate summary
          summary="\n=== Scan Summary ===
          Total files processed: $total_files
          Files with images: $files_with_images
          Files without valid images: $files_without_images
          Invalid YAML files: $invalid_yaml_files
          "
          echo -e "$summary" >> "$report_file"
          # Print report
          echo -e "\n📊 Scan Report:"
          cat "$report_file"
          # Fail if any files without images
          if [ "$files_without_images" -gt 0 ]; then
            echo "❌ Found $files_without_images files without valid images"
          fi
          EOF
          chmod +x scan-images.sh
          mkdir -p /tmp/trivy-cache
          ./scan-images.sh

  drift:
    name: Drift Detection
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - name: Install Flux CLI
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
      - name: Check for configuration drift
        run: |
          kustomize build infrastructure/k8s/overlays/dev > dev-manifests.yaml
          kustomize build infrastructure/k8s/overlays/prod > prod-manifests.yaml
          flux diff kustomization curs-valutar-dev \
            --path infrastructure/k8s/overlays/dev \
            || echo "No drift in dev"
          flux diff kustomization curs-valutar-prod \
            --path infrastructure/k8s/overlays/prod \
            || echo "No drift in prod"
