name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod

jobs:
  k8s-lint:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kustomize
        run: |
          curl -s \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.4"
          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -L "$KUBECONFORM_URL" -o kubeconform.tar.gz
          tar xzf kubeconform.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz

      - name: Lint YAML files
        run: |
          pip3 install yamllint
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

      - name: Install Kyverno CLI
        run: |
           curl -sSfL \
            https://github.com/kyverno/kyverno/releases/download/v1.12.4/kyverno-cli_1.12.4_linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin kyverno
      - name: Test Kyverno policies
        run: |
          kyverno apply infrastructure/kyverno/ -r infrastructure/k8s/base --resource-type Deployment

      - name: Validate base manifests
        run: |
          kustomize build infrastructure/k8s/base \
            | kubeconform -verbose

      - name: Validate dev overlay
        run: |
          kustomize build infrastructure/k8s/overlays/dev \
            | kubeconform -verbose

      - name: Validate prod overlay
        run: |
          kustomize build infrastructure/k8s/overlays/prod \
            | kubeconform -verbose
