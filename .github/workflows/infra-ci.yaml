name: "🚦 Infra CI Pipeline"

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    name: 🧰 Setup & Load Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.extract.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        shell: bash
        run: |
          set -euo pipefail
          set -x
          file=".github/versions.yaml"
          yq -o=json '.' "$file" | jq -c . > versions.json
          echo "versions=$(cat versions.json)" >> "$GITHUB_OUTPUT"

  verify-cli-versions:
    name: 🧪 Verify CLI Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          set -x
          bash scripts/install/install-all.sh
          echo "🧪 Installed CLI versions:"
          kubectl version --client
          kyverno version
          flux --version
          kustomize version

  ci:
    name: 🧪 Full Infra CI
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        overlay: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Tools & CLI
        run: |
          set -euo pipefail
          set -x
          bash scripts/install/install-all.sh

      - name: 🧹 Lint YAMLs
        run: |
          set -euo pipefail
          set -x
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

      - name: 📐 Validate K8s Manifests
        run: |
          set -euo pipefail
          set -x
          kustomize build infrastructure/k8s/base | kubeconform -summary
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} | kubeconform -summary

      - name: 🚨 Kyverno Policy Check
        run: |
          set -euo pipefail
          set -x
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} > manifest.yaml
          kyverno apply infrastructure/kyverno --resource manifest.yaml --policy-report | tee kyverno-full.log
          sed -n '/^apiVersion:/,$p' kyverno-full.log > kyverno-report.yaml
          echo "📦 Cleaned kyverno-report.yaml contents:"
          cat kyverno-report.yaml

          if grep -q 'kind:' kyverno-report.yaml; then
            yq -o=json kyverno-report.yaml > kyverno-results.json
          else
            echo "❌ kyverno-report.yaml malformed or empty"
            exit 1
          fi

      - name: 🛡️ Image Vulnerability Scan (Trivy)
        run: |
          set -euo pipefail
          set -x
          source scripts/utils/load-version.sh
          export TRIVY_CACHE_DIR=$(get_version TRIVY_CACHE_DIR)
          chmod +x scripts/utils/scan-images.sh
          echo "🔎 Running scan-images.sh..."
          # 👇 Capture raw output + preserve failure output
          bash scripts/utils/scan-images.sh "${{ matrix.overlay }}" > trivy-full.log.txt 2>&1
            echo "❌ Trivy scan failed — displaying full output below"
            echo "------------------------------------------------"
            cat trivy-full.log.txt
            echo "------------------------------------------------"
            exit 1
          }
          echo "✅ Trivy scan passed"

      - name: 📝 Trivy Scan Summary
        if: always()
        run: |
          echo "## Trivy Vulnerability Summary (${{ matrix.overlay }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          head -n 200 image-scan-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 Drift Detection (Flux & kubectl)
        run: |
          set -euo pipefail
          set -x
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

          flux --context="remote-cloudflare" diff kustomization curs-valutar-${{ matrix.overlay }} \
            --path infrastructure/k8s/overlays/${{ matrix.overlay }} \
            | tee drift-flux-${{ matrix.overlay }}.txt

          kubectl --context=remote-cloudflare diff -k infrastructure/k8s/overlays/${{ matrix.overlay }} \
            | tee drift-kubectl-${{ matrix.overlay }}.txt

          if grep -qE '^[-+]' drift-kubectl-${{ matrix.overlay }}.txt; then
            echo "❌ kubectl diff shows resource drift"
            exit 1
          else
            echo "✅ No resource drift detected by kubectl diff"
          fi

      - name: 📎 Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infra-report-${{ matrix.overlay }}
          path: |
            kyverno-full.log
            kyverno-report.yaml
            kyverno-results.json
            trivy-full.log.txt
            image-scan-report.txt
            vulnerability-details.txt
            trivy-scan-*.json
            drift-flux-${{ matrix.overlay }}.txt
            drift-kubectl-${{ matrix.overlay }}.txt

      - name: 💬 PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let overlay = '${{ matrix.overlay }}';
            let body = `## ✅ Infra CI Summary: \`${overlay}\`\n`;

            const trivy = fs.readFileSync(`vulnerability-details.txt`, 'utf8');
            body += `\n### Trivy Vulnerabilities:\n\`\`\`\n${trivy.slice(0,800) || '(none)'}\n\`\`\``;

            const kyvernoJson = JSON.parse(fs.readFileSync('kyverno-results.json','utf8'));
            const violations = kyvernoJson.results?.filter(r => r.result === 'fail') || [];
            if (violations.length > 0) {
              body += `\n### Kyverno Violations:\n`;
              violations.forEach(v => {
                body += `- 🔴 ${v.resources?.[0]?.kind} "${v.resources?.[0]?.name}": ${v.message}\n`;
              });
            } else {
              body += `\n✅ No Kyverno policy violations\n`;
            }

            const drift = fs.readFileSync(`drift-kubectl-${overlay}.txt`, 'utf8');
            body += `\n### Kubectl Drift:\n\`\`\`\n${drift.slice(0,400)}\n\`\`\``;

            const pr = context.payload.pull_request?.number;
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }
