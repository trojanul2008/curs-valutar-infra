name: 🚦 Infra CI Pipeline

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  KUSTOMIZE_VERSION: v5.0.2
  KUBECONFORM_VERSION: v0.6.4
  KYVERNO_VERSION: v1.12.4
  YQ_VERSION: v4.43.1
  TRIVY_CACHE_DIR: /tmp/trivy-cache
  KUBECTL_CONTEXT: remote-cloudflare

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint all YAML files
        run: |
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Kustomize
        run: |
          curl -sL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/"\
          "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Install Kubeconform
        run: |
          curl -sL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/"\
            "kubeconform-linux-amd64.tar.gz" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate overlays
        run: |
          kustomize build infrastructure/k8s/base | kubeconform -verbose -summary
          kustomize build infrastructure/k8s/overlays/dev | kubeconform -verbose -summary
          kustomize build infrastructure/k8s/overlays/prod | kubeconform -verbose -summary

  policy:
    name: Kyverno Policy Check
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: ${{ env.KYVERNO_VERSION }}
      - name: Apply Kyverno policies
        run: |
          kustomize build infrastructure/k8s/base > base.yaml
          kyverno apply infrastructure/kyverno \
            --resource base.yaml \
            --output json > kyverno-results.json || true
          jq -e '.failed | length == 0' kyverno-results.json \
            && echo "✅ All policies passed" || exit 1

  scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - name: Install yq and Trivy
        run: |
          sudo wget "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.65.0
      - name: Cache vulnerability DB
        run: |
          mkdir -p "${TRIVY_CACHE_DIR}"
          trivy image --download-db-only --cache-dir "${TRIVY_CACHE_DIR}"
      - name: Scan container images
        run: |
          chmod +x .github/scripts/scan-images.sh
          TRIVY_CACHE_DIR="${TRIVY_CACHE_DIR}" .github/scripts/scan-images.sh

  drift:
    name: Drift Detection via Flux
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - name: Install Flux
        run: curl -s https://fluxcd.io/install.sh | sudo bash
      - name: Detect Drift in Environments
        run: |
          flux --context=${{ env.KUBECTL_CONTEXT }} diff kustomization curs-valutar-dev \
            --path infrastructure/k8s/overlays/dev || echo "✅ No drift in dev"
          flux --context=${{ env.KUBECTL_CONTEXT }} diff kustomization curs-valutar-prod \
            --path infrastructure/k8s/overlays/prod || echo "✅ No drift in prod"
