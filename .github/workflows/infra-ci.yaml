name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev

env:
  KUSTOMIZE_VERSION: v5.0.2
  KUBECONFORM_VERSION: v0.6.4
  KYVERNO_VERSION: v1.12.4
  CHAOS_MESH_VERSION: v2.6.1

jobs:

  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: peaceiris/actions-kustomize@v3
        with:
          version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Setup kubeconform
        uses: instrumenta/kubeconform-action@v1
        with:
          version: ${{ env.KUBECONFORM_VERSION }}

      - name: Validate base
        run: |
          kustomize build infrastructure/k8s/base \
            | kubeconform -verbose

      - name: Validate dev overlay
        run: |
          kustomize build infrastructure/k8s/overlays/dev \
            | kubeconform -verbose

      - name: Validate prod overlay
        run: |
          kustomize build infrastructure/k8s/overlays/prod \
            | kubeconform -verbose

  policy:
    name: Kyverno Policies
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@v4

      - name: Use Kyverno Action
        uses: kyverno/kyverno-action@v1
        with:
          version: ${{ env.KYVERNO_VERSION }}

      - name: Test Kyverno policies
        run: |
          kustomize build infrastructure/k8s/base > base-manifests.yaml
          kyverno apply infrastructure/kyverno/ \
            --resource base-manifests.yaml \
            --output json > kyverno-results.json || true

          if jq -e '.failed | length > 0' kyverno-results.json; then
            echo "❌ Kyverno policy violations detected:"
            jq -r '
              .failed[] |
              "RESOURCE: \(.resource.kind)/\(.resource.name) | POLICY: \(.policy) | RULE: \(.rule)"
            ' kyverno-results.json
            exit 1
          else
            echo "✅ All Kyverno policies passed"
          fi

  scan:
    name: Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: policy
    if: github.ref != 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Action
        uses: aquasecurity/trivy-action@master
        with:
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Run Scanner
        run: ./.github/scripts/scan-images.sh

  drift:
    name: Drift Detection
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4

      - name: Install Flux CLI
        uses: fluxcanary/install-flux@v0.2.0

      - name: Check for configuration drift
        run: |
          flux diff kustomization curs-valutar-dev \
            --path infrastructure/k8s/overlays/dev \
            || echo "No drift in dev"
          flux diff kustomization curs-valutar-prod \
            --path infrastructure/k8s/overlays/prod \
            || echo "No drift in prod"
