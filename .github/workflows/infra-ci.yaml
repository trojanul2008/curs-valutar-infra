name: 🚦 Infra CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

env:
  KUSTOMIZE_VERSION: v5.0.2
  KUBECONFORM_VERSION: v0.6.7
  KYVERNO_VERSION: v1.12.4
  YQ_VERSION: v4.43.1
  TRIVY_VERSION: 0.50.1
  TRIVY_CACHE_DIR: /tmp/trivy-cache
  HELM_PLUGIN_DIR: ~/.local/share/helm/plugins
  KUBECTL_CONTEXT: remote-cloudflare

jobs:
  lint:
    name: 🧹 YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: bash scripts/install/install-all.sh
      - name: Lint all YAML files
        run: |
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

  schema:
    name: 📐 Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        overlay: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: bash scripts/install/install-all.sh
      - name: Prepare kustomize cache path
        run: mkdir -p ~/.cache/kustomize
      - name: Cache kustomize
        uses: actions/cache@v3
        with:
          path: ~/.cache/kustomize
          key: kustomize-${{ matrix.overlay }}-${{ hashFiles('infrastructure/k8s/overlays/**') }}
      - name: Validate overlays with kubeconform
        run: |
          kustomize build infrastructure/k8s/base | kubeconform -verbose -summary
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} | kubeconform -verbose -summary

  policy:
    name: 🚨 Kyverno Policy Check
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: bash scripts/install/install-all.sh
      - name: Apply Kyverno and generate report
        run: |
          echo "🔍 Building Kubernetes base manifest..."
          kustomize build infrastructure/k8s/base > base.yaml
          echo "🚨 Running Kyverno policy checks..."
          kyverno apply infrastructure/kyverno \
            --resource base.yaml \
            --policy-report | tee kyverno-raw.txt
          echo "📄 Extracting PolicyReport YAML..."
          awk '/^apiVersion:/,0' kyverno-raw.txt > kyverno-policyreport.yaml
          echo "🔄 Converting YAML to JSON..."
          yq -o=json kyverno-policyreport.yaml > kyverno-results.json
      - name: Debug Kyverno Output
        run: cat kyverno-results.json
      - name: Extract failed Kyverno policy count
        run: |
          echo "🔍 Failed policy count:"
          jq '.summary.fail' kyverno-results.json
      - name: Show failed Kyverno policies in console and exit if any
        run: |-
          FAIL_COUNT=$(jq '.summary.fail' kyverno-results.json)
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "🚨 Kyverno found $FAIL_COUNT policy violation(s)!"
            echo "🧾 Listing sorted violations by severity..."

            # Sort violations by severity category: 🔴 > 🟠 > 🟢
            jq -c '.results[] | select(.result == "fail")' kyverno-results.json \
              | jq -s '
                  sort_by(
                    if (.policy | test("security") or .rule | test("privilege")) then 1
                    elif (.policy | test("label") or .rule | test("label")) then 3
                    else 2 end
                  )[]' > kyverno-violations.json

            COMMENT_BODY="🚨 **Kyverno Policy Violations**\n\n"

            while IFS= read -r violation; do
              POLICY=$(echo "$violation" | jq -r '.policy')
              RESOURCE_KIND=$(echo "$violation" | jq -r '.resources[0].kind')
              RESOURCE_NAME=$(echo "$violation" | jq -r '.resources[0].name')
              RESOURCE_NS=$(echo "$violation" | jq -r '.resources[0].namespace')
              RULE=$(echo "$violation" | jq -r '.rule')
              MESSAGE=$(echo "$violation" | jq -r '.message')

              SEVERITY="🟠"
              if [[ "$RULE" == *"privilege"* || "$POLICY" == *"security"* ]]; then
                SEVERITY="🔴"
              elif [[ "$POLICY" == *"label"* || "$RULE" == *"label"* ]]; then
                SEVERITY="🟢"
              fi

              echo ""
              echo "$SEVERITY $RESOURCE_KIND \"$RESOURCE_NAME\" in namespace \"$RESOURCE_NS\""
              echo "    ├─ Policy: $POLICY"
              echo "    ├─ Rule: $RULE"
              echo "    └─ Message: $MESSAGE"

              COMMENT_BODY+="$SEVERITY $RESOURCE_KIND \"$RESOURCE_NAME\" in namespace \"$RESOURCE_NS\"\n"
              COMMENT_BODY+="• Policy: $POLICY\n"
              COMMENT_BODY+="• Rule: $RULE\n"
              COMMENT_BODY+="• Message: $MESSAGE\n\n"

              echo ""
              echo "🔎 Searching for resource in manifests..."
              MATCHED_FILE=$(grep -rli "$RESOURCE_NAME" infrastructure/ | grep -E '\.ya?ml$' | head -n 1)

              if [ -n "$MATCHED_FILE" ]; then
                echo "📁 Found in: $MATCHED_FILE"

                echo "🔍 Labels via yq:"
                yq eval-all 'select(.kind == "'"$RESOURCE_KIND"'" and .metadata.name == "'"$RESOURCE_NAME"'") | .metadata.labels' "$MATCHED_FILE" || echo "⚠️ Labels not found."

                echo "📝 Annotations:"
                yq eval-all 'select(.kind == "'"$RESOURCE_KIND"'" and .metadata.name == "'"$RESOURCE_NAME"'") | .metadata.annotations' "$MATCHED_FILE" || echo "⚠️ Annotations not found."

                echo "📦 Full Resource Block:"
                yq eval-all 'select(.kind == "'"$RESOURCE_KIND"'" and .metadata.name == "'"$RESOURCE_NAME"'")' "$MATCHED_FILE" || echo "⚠️ Could not extract full block."
              else
                echo "❓ File not found in expected paths."
              fi

              echo "🌐 Fallback: Live resource via kubectl..."
              if kubectl config current-context &>/dev/null; then
                kubectl get "$RESOURCE_KIND" "$RESOURCE_NAME" -n "$RESOURCE_NS" -o json 2>/dev/null | jq '.metadata.labels, .metadata.annotations' || echo "⚠️ Could not fetch live labels/annotations."
              else
                echo "🚫 Skipping kubectl fallback: No kube context available."
              fi

              echo ""
            done < kyverno-violations.json

            echo "🧮 Summary: $FAIL_COUNT violation(s) flagged."
            echo -e "$COMMENT_BODY" > kyverno-github-comment.md
            exit 1
          else
            echo "✅ No policy violations detected."
          fi
      - name: Upload Kyverno result artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-result
          path: kyverno-results.json

  post-comment:
    name: 💬 Kyverno Violation Comment
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Kyverno result
        uses: actions/download-artifact@v4
        with:
          name: kyverno-result

      - name: Check Kyverno failure count
        id: check
        run: |
          FAIL_COUNT=$(jq '.summary.fail' kyverno-results.json)
          echo "🔍 Detected Kyverno violations: $FAIL_COUNT"
          echo "fail_count=$FAIL_COUNT" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.check.outputs.fail_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('kyverno-results.json', 'utf8'));
            const violations = results.results?.filter(r => r.result === "fail") || [];

            // Sort by severity: 🔴 → 🟠 → 🟢
            const sorted = violations.sort((a, b) => {
              const score = (v) => {
                if ((v.policy || '').includes('security') || (v.rule || '').includes('privilege')) return 1;
                if ((v.policy || '').includes('label') || (v.rule || '').includes('label')) return 3;
                return 2;
              };
              return score(a) - score(b);
            });

            let body = `🚨 **${sorted.length} Kyverno Policy Violation${sorted.length > 1 ? 's' : ''}**\n\n`;

            for (const v of sorted) {
              const kind = v.resources?.[0]?.kind || '';
              const name = v.resources?.[0]?.name || '';
              const ns = v.resources?.[0]?.namespace || '';
              const policy = v.policy;
              const rule = v.rule;
              const message = v.message;

              let severity = '🟠';
              if (policy.includes('security') || rule.includes('privilege')) {
                severity = '🔴';
              } else if (policy.includes('label') || rule.includes('label')) {
                severity = '🟢';
              }

              body += `${severity} ${kind} "${name}" in namespace "${ns}"\n`;
              body += `• Policy: ${policy}\n`;
              body += `• Rule: ${rule}\n`;
              body += `• Message: ${message}\n\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

              // 🔥 Fail the job intentionally
              core.setFailed(`${violations.length} Kyverno violation(s) detected`);
            } else {
              console.log("✅ No violations detected.");
            }

      - name: Upload Kyverno result summary
        if: steps.check.outputs.fail_count == '0'
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-summary
          path: kyverno-results.json

  scan:
    name: 🛡️ Container Image Scan
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: bash scripts/install/install-all.sh
      - name: Prepare Trivy cache directory
        run: mkdir -p "${TRIVY_CACHE_DIR}"
      - name: Cache Trivy DB
        uses: actions/cache@v3
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ hashFiles('scripts/utils/scan-images.sh') }}
      - name: Run Trivy scan
        run: |
          chmod +x scripts/utils/scan-images.sh
          TRIVY_CACHE_DIR="${TRIVY_CACHE_DIR}" scripts/utils/scan-images.sh > trivy-report.txt
          grep 'CRITICAL\|HIGH' trivy-report.txt > trivy-summary.txt || true
      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: 🛡️-trivy-scan
          path: |
            trivy-report.txt
            trivy-summary.txt
      - name: GitHub comment on Trivy summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('trivy-summary.txt', 'utf8').slice(0, 6000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🛡️ **Trivy Vulnerability Summary**\n\n\`\`\`\n${summary}\n\`\`\``
            });

  drift:
    name: 📊 Drift Detection via Flux
    runs-on: ubuntu-latest
    needs: scan
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Install Flux
        run: curl -s https://fluxcd.io/install.sh | sudo bash
      - name: Prepare Helm plugin cache
        run: mkdir -p ${{ env.HELM_PLUGIN_DIR }}
      - name: Cache Helm plugins
        uses: actions/cache@v3
        with:
          path: ${{ env.HELM_PLUGIN_DIR }}
          key: helm-plugins-${{ matrix.env }}-${{ hashFiles('scripts/install/install-helm.sh') }}
      - name: Detect drift in ${{ matrix.env }}
        run: |
          flux --context=${{ env.KUBECTL_CONTEXT }} diff kustomization curs-valutar-${{ matrix.env }} \
            --path infrastructure/k8s/overlays/${{ matrix.env }} > drift-${{ matrix.env }}.txt || true
      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: 📊-drift-${{ matrix.env }}
          path: drift-${{ matrix.env }}.txt
      - name: GitHub comment on drift
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          MATRIX_ENV: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-${{ matrix.env }}.txt', 'utf8').slice(0, 6000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 **Flux Drift Report (${process.env.MATRIX_ENV})**\n\n\`\`\`\n${report}\n\`\`\``
            })
