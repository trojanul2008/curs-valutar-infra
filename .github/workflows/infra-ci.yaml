name: "🚦 Infrastructure CI"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate ${{ matrix.environment }} desired state"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned CI tools
        run: scripts/install/install-ci-tools.sh

      - name: Lint YAML
        run: |
          find infrastructure .github \
            -type f \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -print0 \
            | xargs -0 yamllint -c .yamllint.yml

      - name: Render Kubernetes manifests
        run: |
          mkdir -p artifacts

          kustomize build \
            "infrastructure/k8s/overlays/${{ matrix.environment }}" \
            > "artifacts/manifest-${{ matrix.environment }}.yaml"

          test -s "artifacts/manifest-${{ matrix.environment }}.yaml"

          echo "Rendered resources:"
          grep '^kind:' \
            "artifacts/manifest-${{ matrix.environment }}.yaml" \
            || true

      - name: Validate Kubernetes schemas
        run: |
          kubeconform \
            -strict \
            -summary \
            "artifacts/manifest-${{ matrix.environment }}.yaml"

      - name: Validate Kyverno policies
        run: |
          kyverno apply infrastructure/kyverno \
            --resource "artifacts/manifest-${{ matrix.environment }}.yaml" \
            --policy-report \
            | tee "artifacts/kyverno-${{ matrix.environment }}.log"

      - name: Validate Checkov policies
        shell: bash
        run: |
          ENVIRONMENT="${{ matrix.environment }}"
          FILE="artifacts/checkov-${ENVIRONMENT}.json"

          set +e

          # CKV_K8S_43 remains temporarily skipped because immutable
          # image digest deployment is handled in the later application
          # delivery-pipeline migration.
          checkov             -f "artifacts/manifest-${ENVIRONMENT}.yaml"             --framework kubernetes             --skip-check CKV_K8S_43             -o json             > "$FILE"

          RC=$?

          set -e

          if [[ ! -s "$FILE" ]]; then
            echo "ERROR: Checkov did not produce a report."
            exit 1
          fi

          if ! jq empty "$FILE" >/dev/null 2>&1; then
            echo "ERROR: Checkov report is not valid JSON."
            exit 1
          fi

          PASSED="$(jq '.results.passed_checks | length' "$FILE")"
          FAILED="$(jq '.results.failed_checks | length' "$FILE")"
          SKIPPED="$(jq '.results.skipped_checks | length' "$FILE")"

          echo "Checkov summary:"
          echo "  passed=$PASSED"
          echo "  failed=$FAILED"
          echo "  skipped=$SKIPPED"

          if [[ "$FAILED" -gt 0 ]]; then
            echo
            echo "Blocking Checkov findings:"

            jq -r '
              .results.failed_checks[]?
              | "\(.check_id) | \(.check_name) | \(.resource)"
            ' "$FILE"

            exit 1
          fi

          if [[ "$RC" -ne 0 ]]; then
            echo "ERROR: Checkov returned an unexpected non-zero exit code: $RC"
            exit "$RC"
          fi

          echo
          echo "Checkov policy validation passed."

      - name: Trivy configuration report
        run: |
          trivy config \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            "artifacts/manifest-${{ matrix.environment }}.yaml" \
            | tee "artifacts/trivy-config-${{ matrix.environment }}.txt"

      - name: Trivy image vulnerability report
        shell: bash
        run: |
          mkdir -p artifacts/trivy-images

          mapfile -t IMAGES < <(
            yq -r '.. | .image? | select(.)' \
              "artifacts/manifest-${{ matrix.environment }}.yaml" \
              | sort -u
          )

          if [[ "${#IMAGES[@]}" -eq 0 ]]; then
            echo "No container images found."
            exit 1
          fi

          for IMAGE in "${IMAGES[@]}"; do
            SAFE_NAME="$(
              printf '%s' "$IMAGE" \
                | tr '/:@' '____'
            )"

            echo "Scanning $IMAGE"

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --no-progress \
              --format json \
              --output "artifacts/trivy-images/${SAFE_NAME}.json" \
              "$IMAGE"
          done

      - name: Security summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.environment }} infrastructure validation"
            echo

            FILE="artifacts/checkov-${{ matrix.environment }}.json"

            if [[ -f "$FILE" ]]; then
              PASSED="$(jq '.results.passed_checks | length' "$FILE")"
              FAILED="$(jq '.results.failed_checks | length' "$FILE")"

              echo "### Checkov"
              echo "- Passed: $PASSED"
              echo "- Failed: $FAILED"
              echo
            fi

            echo "### Trivy"
            echo "HIGH/CRITICAL image vulnerabilities are currently reported but are not yet a blocking CI gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infrastructure-ci-${{ matrix.environment }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
