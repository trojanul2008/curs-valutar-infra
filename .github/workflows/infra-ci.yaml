---
name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod

jobs:
  k8s-lint:
    name: Validate K8s Manifests on ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print branch info
        run: echo "Running on branch: ${{ github.ref_name }}"

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.4"
          curl -L "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o kubeconform.tar.gz
          tar xzf kubeconform.tar.gz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz

      - name: Validate base manifests
        run: kustomize build infrastructure/k8s/base | kubeconform -verbose

      - name: Validate dev overlay
        run: kustomize build infrastructure/k8s/overlays/dev | kubeconform -verbose

      - name: Validate prod overlay
        run: kustomize build infrastructure/k8s/overlays/prod | kubeconform -verbose

