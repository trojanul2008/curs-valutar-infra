name: "🚦 Infra CI Pipeline"

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    name: 🧰 Setup & Load Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.extract.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        shell: bash
        run: |
          file=".github/versions.yaml"
          extract() {
            yq -o=json '.' "$file" | jq -c .
          }
          echo "versions=$(extract)" >> "$GITHUB_OUTPUT"

  verify-cli-versions:
    name: 🧪 Verify CLI Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install/install-all.sh
      - run: |
          echo "🧪 Installed CLI versions:"
          kubectl version --client
          kyverno version
          flux --version
          kustomize version

  ci:
    name: 🧪 Full Infra CI
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        overlay: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Tools & CLI
        run: bash scripts/install/install-all.sh

      - name: 🧹 Lint YAMLs
        run: |
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

      - name: 📐 Validate K8s Manifests
        run: |
          kustomize build infrastructure/k8s/base | kubeconform -summary
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} | kubeconform -summary

      - name: 🚨 Kyverno Policy Check
        run: |
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} > manifest.yaml
          if kyverno apply infrastructure/kyverno --resource manifest.yaml --policy-report > kyverno-report.yaml; then
            echo "📦 kyverno-report.yaml contents:"
            cat kyverno-report.yaml
            if grep -q 'kind:' kyverno-report.yaml; then
              yq -o=json kyverno-report.yaml > kyverno-results.json
              head -n 10 kyverno-report.yaml
            else
              echo "⚠️ kyverno-report.yaml looks malformed — missing expected keys"
              exit 1
            fi
          else
            echo "❌ Kyverno apply failed — skipping parsing"
            exit 1
          fi

      - name: 🛡️ Image Vulnerability Scan (Trivy)
        run: |
          chmod +x scripts/utils/scan-images.sh
          scripts/utils/scan-images.sh > trivy-report.txt
          grep -E 'CRITICAL|HIGH' trivy-report.txt > trivy-summary.txt || echo "✅ No critical vulnerabilities"

      - name: 📊 Drift Detection (Flux)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          flux --context="CTX_${{ matrix.overlay }}" diff kustomization curs-valutar-${{ matrix.overlay }} \
            --path infrastructure/k8s/overlays/${{ matrix.overlay }} > drift.txt || echo "❌ Drift check failed"

      - name: 💬 PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = `### ✅ Infra CI Report: \`${{ matrix.overlay }}\`\n\n`;

            const kyverno = JSON.parse(fs.readFileSync('kyverno-results.json','utf8'));
            const violations = kyverno.results?.filter(r => r.result === 'fail') || [];
            body += `**Kyverno Violations:** ${violations.length}\n`;
            violations.forEach(v => {
              body += `- 🔴 ${v.resources?.[0]?.kind} "${v.resources?.[0]?.name}" — ${v.message}\n`;
            });

            const trivy = fs.readFileSync('trivy-summary.txt','utf8');
            body += `\n**Trivy Summary:**\n${trivy}\n`;

            const drift = fs.readFileSync('drift.txt','utf8');
            body += `\n**Drift Detection:**\n\`\`\`\n${drift.slice(0,500)}\n\`\`\``;

            const pr = context.payload.pull_request?.number;
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }
