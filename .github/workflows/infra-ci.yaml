name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod

jobs:
  k8s-lint:
    # job name can now interpolate matrix.branch
    name: Validate K8s Manifests on ${{ matrix.branch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # define both branches here
        branch: [ dev, prod ]
    # only run the matrix entry matching the branch that was pushed
    if: github.ref_name == matrix.branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print branch info
        run: echo "Running on branch: ${{ matrix.branch }}"

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.4"
          curl -L "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate base manifests
        run: kustomize build infrastructure/k8s/base | kubeconform -verbose

      - name: Validate dev overlay
        run: kustomize build infrastructure/k8s/overlays/dev | kubeconform -verbose

      - name: Validate prod overlay
        run: kustomize build infrastructure/k8s/overlays/prod | kubeconform -verbose

