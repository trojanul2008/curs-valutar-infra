name: "🚦 Infrastructure CI"

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dev:
    name: "Validate DEV desired state"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned CI tools
        run: scripts/install/install-ci-tools.sh

      - name: Lint YAML
        run: |
          find infrastructure .github \
            -type f \
            \( -name '*.yaml' -o -name '*.yml' \) \
            -print0 \
            | xargs -0 yamllint -c .yamllint.yml

      - name: Render DEV manifests
        run: |
          mkdir -p artifacts

          kustomize build infrastructure/k8s/overlays/dev \
            > artifacts/manifest-dev.yaml

          test -s artifacts/manifest-dev.yaml

          echo "Rendered resources:"
          grep '^kind:' artifacts/manifest-dev.yaml || true

      - name: Validate Kubernetes schemas
        run: |
          kubeconform \
            -strict \
            -summary \
            artifacts/manifest-dev.yaml

      - name: Validate Kyverno policies
        run: |
          kyverno apply infrastructure/kyverno \
            --resource artifacts/manifest-dev.yaml \
            --policy-report \
            | tee artifacts/kyverno-dev.log

      - name: Validate Checkov policies
        shell: bash
        run: |
          set +e

          checkov \
            -f artifacts/manifest-dev.yaml \
            --framework kubernetes \
            --skip-check CKV_K8S_43 \
            -o json \
            > artifacts/checkov-dev.json

          RC=$?

          set -e

          echo "Checkov summary:"
          jq '{
            passed: (.results.passed_checks | length),
            failed: (.results.failed_checks | length),
            skipped: (.results.skipped_checks | length)
          }' artifacts/checkov-dev.json

          if [[ "$RC" -ne 0 ]]; then
            echo
            echo "Checkov failed checks:"

            jq -r '
              .results.failed_checks[]? |
              "\(.check_id) | \(.check_name) | \(.resource)"
            ' artifacts/checkov-dev.json

            exit "$RC"
          fi

      - name: Trivy configuration report
        run: |
          trivy config \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            artifacts/manifest-dev.yaml \
            | tee artifacts/trivy-config-dev.txt

      - name: Trivy image vulnerability report
        shell: bash
        run: |
          mkdir -p artifacts/trivy-images

          mapfile -t IMAGES < <(
            yq -r '.. | .image? | select(.)' \
              artifacts/manifest-dev.yaml \
              | sort -u
          )

          if [[ "${#IMAGES[@]}" -eq 0 ]]; then
            echo "No container images found."
            exit 1
          fi

          for IMAGE in "${IMAGES[@]}"; do
            SAFE_NAME="$(
              printf '%s' "$IMAGE" \
                | tr '/:@' '____'
            )"

            echo "Scanning $IMAGE"

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --no-progress \
              --format json \
              --output "artifacts/trivy-images/${SAFE_NAME}.json" \
              "$IMAGE"
          done

      - name: Security summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DEV infrastructure validation"
            echo

            if [[ -f artifacts/checkov-dev.json ]]; then
              PASSED="$(jq '.results.passed_checks | length' artifacts/checkov-dev.json)"
              FAILED="$(jq '.results.failed_checks | length' artifacts/checkov-dev.json)"

              echo "### Checkov"
              echo "- Passed: $PASSED"
              echo "- Failed: $FAILED"
              echo
            fi

            echo "### Trivy"
            echo "HIGH/CRITICAL image vulnerabilities are currently reported but are not yet a blocking CI gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-ci-dev
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
