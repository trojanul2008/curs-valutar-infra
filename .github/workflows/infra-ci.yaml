name: "🚦 Infra CI Pipeline"

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    name: 🧰 Setup & Load Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.extract.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        shell: bash
        run: |
          set -euo pipefail
          set -x
          file=".github/versions.yaml"
          yq -o=json '.' "$file" | jq -c . > versions.json
          echo "versions=$(cat versions.json)" >> "$GITHUB_OUTPUT"

  verify-cli-versions:
    name: 🧪 Verify CLI Versions
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          set -x
          bash scripts/install/install-all.sh
          echo "🧪 Installed CLI versions:"
          kubectl version --client
          kyverno version
          flux --version
          kustomize version

          # # Optional version pin check
          # required_kustomize="v5.0.1"
          # installed_kustomize=$(kustomize version | grep -oE 'v[0-9\.]+')
          # if [[ "$installed_kustomize" != "$required_kustomize" ]]; then
          #   echo "❌ Kustomize version mismatch"
          #   exit 1
          # fi

  ci:
    name: 🧪 Full Infra CI
    runs-on: ubuntu-latest
    needs: [setup, verify-cli-versions]
    strategy:
      matrix:
        overlay: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Tools
        run: |
          set -euo pipefail
          set -x
          bash scripts/install/install-all.sh

      - name: 🧬 Dump Environment
        run: env

      - name: 🗂 Dump File Tree
        run: find . -type f | sort

      - name: 🔍 Dump Trivy Version & Config Help
        run: |
          trivy -v
          trivy config --help
          env | grep -i trivy || true

      - name: 🧹 Lint YAMLs
        run: |
          set -euo pipefail
          set -x
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml

          # Optional: Helm lint if Helm charts exist
          if [ -d helm ]; then
            for chart in helm/*; do
              helm lint "$chart" || exit 1
            done
          fi

      - name: 📐 Validate K8s Manifests
        run: |
          set -euo pipefail
          set -x
          kustomize build infrastructure/k8s/base | kubeconform -summary
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} | kubeconform -summary

      - name: 🚨 Kyverno Policy Check
        run: |
          set -euo pipefail
          set -x
          kustomize build infrastructure/k8s/overlays/${{ matrix.overlay }} > manifest-${{ matrix.overlay }}.yaml
          kyverno apply infrastructure/kyverno --resource manifest-${{ matrix.overlay }}.yaml --policy-report | tee kyverno-full-${{ matrix.overlay }}.log
          sed -n '/^apiVersion:/,$p' kyverno-full-${{ matrix.overlay }}.log > kyverno-report-${{ matrix.overlay }}.yaml
          echo "📦 Cleaned kyverno-report-${{ matrix.overlay }}.yaml contents:"
          cat kyverno-report-${{ matrix.overlay }}.yaml
          if grep -q 'kind:' kyverno-report-${{ matrix.overlay }}.yaml; then
            if ! yq -o=json kyverno-report-${{ matrix.overlay }}.yaml > kyverno-results-${{ matrix.overlay }}.json; then
              echo "⚠️ yq failed, writing empty JSON"
              echo '{}' > kyverno-results-${{ matrix.overlay }}.json
            fi
          else
            echo "❌ kyverno-report.yaml malformed or empty"
            exit 1
          fi

      - name: 🔍 Image & Config Security Scans (Trivy)
        run: |
          set -euo pipefail
          set -x
          source scripts/utils/load-version.sh
          export TRIVY_CACHE_DIR=$(get_version TRIVY_CACHE_DIR)
          chmod +x scripts/utils/scan-images.sh
          echo "🔎 Running scan-images.sh with config scan..."

          if ! bash -x scripts/utils/scan-images.sh "${{ matrix.overlay }}" 2>&1 | tee trivy-full-${{ matrix.overlay }}.log.txt; then
            echo "❌ Trivy scan failed"
            cat trivy-full-${{ matrix.overlay }}.log.txt
            exit 1
          fi

          echo "✅ Trivy image & config scans passed"

          # Optional: Snyk scan (requires API token)
          snyk test --file=manifest-${{ matrix.overlay }}.yaml || true

          # Optional: Checkov config scan
          checkov -f manifest-${{ matrix.overlay }}.yaml -o json > checkov-${{ matrix.overlay }}.json

      - name: 📝 Extended Scan Summary
        if: always()
        run: |
          echo "## Infra Scan Summary (${{ matrix.overlay }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f scan-results/image-scan-report-${{ matrix.overlay }}.txt ]]; then
            echo "### Trivy Image Scan" >> "$GITHUB_STEP_SUMMARY"
            head -n 100 scan-results/image-scan-report-${{ matrix.overlay }}.txt >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f scan-results/trivy-config-${{ matrix.overlay }}.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Trivy Config Scan" >> "$GITHUB_STEP_SUMMARY"
            head -n 100 scan-results/trivy-config-${{ matrix.overlay }}.txt >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f kyverno-report-${{ matrix.overlay }}.yaml ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Kyverno Policy Report" >> "$GITHUB_STEP_SUMMARY"
            yq eval '.results[] | "- \(.message) [\(.policy)] for \(.resources[0].name)"' kyverno-report-${{ matrix.overlay }}.yaml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📊 Drift Detection (Parallel)
        run: |
          set -euo pipefail
          set -x
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

          flux --context="remote-cloudflare" diff kustomization curs-valutar-${{ matrix.overlay }} \
            --path infrastructure/k8s/overlays/${{ matrix.overlay }} \
            > drift-flux-${{ matrix.overlay }}.txt &

          kubectl --context=remote-cloudflare diff -k infrastructure/k8s/overlays/${{ matrix.overlay }} \
            > drift-kubectl-${{ matrix.overlay }}.txt &

          wait

          if grep -qE '^[-+]' drift-kubectl-${{ matrix.overlay }}.txt; then
            echo "❌ kubectl diff shows resource drift"
            exit 1
          else
            echo "✅ No resource drift detected"
          fi

      - name: 📎 Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infra-report-${{ matrix.overlay }}
          path: |
            kyverno-full-${{ matrix.overlay }}.log
            kyverno-report-${{ matrix.overlay }}.yaml
            kyverno-results-${{ matrix.overlay }}.json
            manifest-${{ matrix.overlay }}.yaml
            trivy-full-${{ matrix.overlay }}.log.txt
            scan-results/image-scan-report-${{ matrix.overlay }}.txt
            scan-results/vulnerability-details-${{ matrix.overlay }}.txt
            trivy-scan-*.json
            scan-results/trivy-config-${{ matrix.overlay }}.txt
            drift-flux-${{ matrix.overlay }}.txt
            drift-kubectl-${{ matrix.overlay }}.txt
            # Optional
            checkov-${{ matrix.overlay }}.json

      - name: 💬 PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let overlay = '${{ matrix.overlay }}';
            let body = `## ✅ Infra CI Summary: \`${overlay}\`\n`;

            let trivy = '';
            let configScan = '';
            try {
              trivy = fs.readFileSync(`scan-results/vulnerability-details-${overlay}.txt`, 'utf8');
            } catch {}
            try {
              configScan = fs.readFileSync(`scan-results/trivy-config-${overlay}.txt`, 'utf8');
            } catch {}

            body += `### Trivy Scan Results\n\`\`\`\n${trivy.slice(0, 500)}\n\`\`\`\n`;
            body += `### Config Scan Results\n\`\`\`\n${configScan.slice(0, 500)}\n\`\`\`\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
