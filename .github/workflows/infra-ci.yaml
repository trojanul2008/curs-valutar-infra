name: Infra Validation

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev

env:
  KUSTOMIZE_VERSION: v5.0.2
  KUBECONFORM_VERSION: 0.6.4
  KYVERNO_VERSION: v1.12.4
  YQ_VERSION: v4.43.1
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install yamllint
        run: pip install yamllint
      - name: Debug - Show yamllint version
        run: yamllint --version
      - name: Lint YAML
        run: |
          echo "Linting YAML files..."
          find infrastructure -name '*.yaml' -o -name '*.yml' \
            | xargs yamllint -c .yamllint.yml
          echo "YAML linting completed"

  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Debug - Show environment
        run: env | sort
      - name: Install Kustomize
        run: |
          echo "Installing Kustomize $KUSTOMIZE_VERSION"
          BASE_URL="https://github.com/kubernetes-sigs/kustomize"
          RELEASE_PATH="releases/download/kustomize%2F$KUSTOMIZE_VERSION"
          FILE="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sL "$BASE_URL/$RELEASE_PATH/$FILE" -o kustomize.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version
      - name: Install Kubeconform
        run: |
          echo "Installing Kubeconform $KUBECONFORM_VERSION"
          BASE_URL="https://github.com/yannh/kubeconform"
          RELEASE_PATH="releases/download/v$KUBECONFORM_VERSION"
          FILE="kubeconform-linux-amd64.tar.gz"
          curl -sL "$BASE_URL/$RELEASE_PATH/$FILE" -o kubeconform.tar.gz
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
      - name: Validate base
        run: |
          echo "Validating base manifests..."
          kustomize build infrastructure/k8s/base \
            | tee base-manifests.yaml \
            | kubeconform -verbose -summary
          echo "Base validation completed"
      - name: Validate dev overlay
        run: |
          echo "Validating dev overlay..."
          kustomize build infrastructure/k8s/overlays/dev \
            | tee dev-manifests.yaml \
            | kubeconform -verbose -summary
          echo "Dev overlay validation completed"
      - name: Validate prod overlay
        run: |
          echo "Validating prod overlay..."
          kustomize build infrastructure/k8s/overlays/prod \
            | tee prod-manifests.yaml \
            | kubeconform -verbose -summary
          echo "Prod overlay validation completed"

  policy:
    name: Kyverno Policy Check
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: ${{ env.KYVERNO_VERSION }}
      - name: Debug - Show Kyverno version
        run: kyverno version
      - name: Test Kyverno policies
        run: |
          echo "Applying Kyverno policies..."
          kustomize build infrastructure/k8s/base > base-manifests.yaml
          kyverno apply infrastructure/kyverno/ \
            --resource base-manifests.yaml \
            --output json > kyverno-results.json || true

          if jq -e '.failed | length > 0' kyverno-results.json; then
            echo "❌ Kyverno policy violations detected:"
            jq -r '.failed[] | "RESOURCE: \(.resource.kind)/\(.resource.name)"' \
              kyverno-results.json
            jq -r '.failed[] | "POLICY: \(.policy) | RULE: \(.rule)"' \
              kyverno-results.json
            exit 1
          else
            echo "✅ All Kyverno policies passed"
          fi


  scan:
    name: Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          # Install yq
          echo "Installing yq $YQ_VERSION"
          sudo wget "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          yq --version

          # Install Trivy
          echo "Installing Trivy"
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Pre-cache vulnerability database
        run: |
          mkdir -p $TRIVY_CACHE_DIR
          trivy image --download-db-only --cache-dir $TRIVY_CACHE_DIR

      - name: Scan container images
        run: |
          cat <<'EOF' > scan-images.sh
          #!/bin/bash
          set -euo pipefail
          # Enhanced debug info
          echo "### SCAN DEBUG INFO ###"
          echo "Trivy version: $(trivy --version | head -1)"
          echo "yq version: $(yq --version)"
          echo "Cache dir: $TRIVY_CACHE_DIR"
          echo "Files to process: $(find infrastructure -type f \( -name '*.yaml' -o -name '*.yml' \) | wc -l)"
          echo "########################"
          # Initialize counters
          total_files=0
          files_with_images=0
          files_without_images=0
          invalid_yaml_files=0
          scan_failed=0
          total_images=0
          scanned_images=0
          vulnerable_images=0
          # Create report file
          report_file="image-scan-report.txt"
          echo "Image Scan Report - $(date)" > "$report_file"
          # Process all YAML files
          while IFS= read -r -d $'\0' file; do
            ((total_files++))
            file_entry="\n===== File: $file =====\n"
            # Skip non-YAML files
            if [[ ! "$file" =~ \.(yaml|yml)$ ]]; then
              file_entry+="Skipped: Not a YAML file\n"
              echo -e "$file_entry" >> "$report_file"
              continue
            fi
            # Check if valid YAML - capture errors
            yq_error=""
            if ! yq_output=$(yq eval 'true' "$file" 2>&1); then
              ((invalid_yaml_files++))
              file_entry+="Skipped: Invalid YAML format\n"
              file_entry+="YQ Error: $yq_output\n"
              echo -e "$file_entry" >> "$report_file"
              echo "⚠️ Invalid YAML: $file - $yq_output" >&2
              continue
            fi
            # Extract images (ignore PLACEHOLDER and Kyverno patterns)
            images=$(
              yq eval '.. | select(has("image")) | .image |
              select(. != null and . != "PLACEHOLDER" and (. | test("^!") | not))' \
              "$file" 2>/dev/null || true
            )
            # Process images if found
            if [ -n "$images" ]; then
              ((files_with_images++))
              file_entry+="Found images:\n"
              while IFS= read -r image; do
                if [ -n "$image" ]; then
                  file_entry+="- $image\n"
                  ((total_images++))
                fi
              done <<< "$images"
              echo -e "$file_entry" >> "$report_file"
              # Scan each image
              while IFS= read -r image; do
                if [ -n "$image" ]; then
                  echo "Scanning $image"
                  ((scanned_images++))
                  if ! trivy image --cache-dir $TRIVY_CACHE_DIR \
                      --exit-code 1 --severity HIGH,CRITICAL "$image"; then
                    echo "❌ Critical vulnerabilities found in $image"
                    scan_failed=1
                    ((vulnerable_images++))
                  fi
                fi
              done <<< "$images"
            else
              ((files_without_images++))
              file_entry+="No valid images found in this file\n"
              echo -e "$file_entry" >> "$report_file"
              echo "ℹ️ File without images: $file" >&2
            fi
          done < <(find infrastructure -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
          # Generate summary
          summary="\n=== Scan Summary ===
          Total files processed: $total_files
          Files with images: $files_with_images
          Files without valid images: $files_without_images
          Invalid YAML files: $invalid_yaml_files
          Total images found: $total_images
          Images scanned: $scanned_images
          Images with vulnerabilities: $vulnerable_images
          "
          echo -e "$summary" >> "$report_file"
          # Print report
          echo -e "\n📊 Scan Report:"
          cat "$report_file"
          # Print files without images to console
          if [ "$files_without_images" -gt 0 ]; then
            echo -e "\nℹ️ Files without valid images:"
            grep -B1 "No valid images found" "$report_file" | grep "File:"
          fi
          # Print invalid YAML files to console
          if [ "$invalid_yaml_files" -gt 0 ]; then
            echo -e "\n⚠️ Invalid YAML files:"
            grep -B1 "Invalid YAML format" "$report_file" | grep "File:"
          fi
          # Exit with error if any scan failed
          if [ "$scan_failed" -eq 1 ]; then
            echo "❌ Critical vulnerabilities found in $vulnerable_images image(s)"
            exit 1
          fi
          echo "✅ Scan completed successfully"
          EOF
          chmod +x scan-images.sh
          mkdir -p $TRIVY_CACHE_DIR
          ./scan-images.sh

  drift:
    name: Drift Detection
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - name: Debug - Show Flux version
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux --version
      - name: Check for configuration drift
        run: |
          echo "Checking for drift in dev environment..."
          kustomize build infrastructure/k8s/overlays/dev > dev-manifests.yaml
          flux diff kustomization curs-valutar-dev \
            --path infrastructure/k8s/overlays/dev || echo "✅ No drift in dev"

          echo "Checking for drift in prod environment..."
          kustomize build infrastructure/k8s/overlays/prod > prod-manifests.yaml
          flux diff kustomization curs-valutar-prod \
            --path infrastructure/k8s/overlays/prod || echo "✅ No drift in prod"
