name: 🚀 Bootstrap Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to bootstrap (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm bootstrapping prod or both"
        required: false
        default: ""

jobs:
  bootstrap:
    name: Bootstrap GitOps stack
    runs-on: ubuntu-latest
    env:
      OWNER: trojanul2008
      REPO: curs-valutar-infra

    steps:
      # ────────────────────────────────────────────────────────────────────────────────
      # 1.  Validate dispatch input (guardrail for prod / both)
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Validate input
        id: validate
        run: |
          set -euo pipefail
          TARGET="${{ inputs.environment }}"
          CONFIRM="${{ inputs.confirm }}"
          echo "📍 Requested bootstrap: ${TARGET}"
          case "${TARGET}" in
            dev|prod|both) ;;
            *) echo "❌ Invalid environment '${TARGET}'. Must be dev, prod, or both."; exit 1 ;;
          esac
          if [[ "${TARGET}" != "dev" && "${CONFIRM}" != "YES" ]]; then
            echo "❌ Confirmation required to bootstrap '${TARGET}'. Aborting."
            exit 1
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
      # ────────────────────────────────────────────────────────────────────────────────
      # 2.  Source checkout
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
      # ────────────────────────────────────────────────────────────────────────────────
      # 3.  Restore kubeconfig & verify access
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Restore kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
          kubectl config use-context remote-cloudflare
          echo "🔑 Kubeconfig restored and context set: $(kubectl config current-context)"
      - name: Verify cluster access
        run: kubectl get nodes
      # ────────────────────────────────────────────────────────────────────────────────
      # 4.  YAML / installer contract validation
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Validate CLI version keys
        run: |
          chmod +x ./scripts/utils/validate-version-keys.sh
          ./scripts/utils/validate-version-keys.sh
      # ────────────────────────────────────────────────────────────────────────────────
      # 5.  Install required CLI tooling
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Install CLI tools
        uses: ./.github/actions/tool-install
      # ────────────────────────────────────────────────────────────────────────────────
      # 6.  Figure out which environments to bootstrap
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Set target environments
        id: envs
        run: |
          TARGET="${{ steps.validate.outputs.target }}"
          [[ "$TARGET" == "both" ]] && echo "list=dev prod" >> "$GITHUB_OUTPUT" || \
            echo "list=${TARGET}" >> "$GITHUB_OUTPUT"
      # ────────────────────────────────────────────────────────────────────────────────
      # 7.  Ensure namespaces exist
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Create target namespaces
        run: |
          for NS in ${{ steps.envs.outputs.list }}; do
            echo "🔧 Ensuring namespace '${NS}' exists..."
            kubectl create ns "${NS}" 2>/dev/null || echo "✔️  Namespace '${NS}' already present"
          done
      # ────────────────────────────────────────────────────────────────────────────────
      # 8.  Install Kyverno (idempotent)
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Install Kyverno (cluster-wide, idempotent)
        run: |
          set -euo pipefail
          echo "📦 Adding Kyverno Helm repo..."
          helm repo add kyverno https://kyverno.github.io/kyverno/ >/dev/null
          helm repo update >/dev/null
          echo "🔧 Ensuring namespace 'kyverno' exists..."
          kubectl create ns kyverno 2>/dev/null || echo "✔️ Namespace 'kyverno' already present"
          echo "🚀 Installing or upgrading Kyverno release..."
          helm upgrade --install kyverno kyverno/kyverno \
            --namespace kyverno \
            --wait \
            --timeout=300s \
            #            --debug \
            >/dev/null
      - name: Verify Kyverno components
        run: |
          set -euo pipefail
          COMPONENTS=(
            kyverno-admission-controller
            kyverno-background-controller
            kyverno-cleanup-controller
            kyverno-reports-controller
          )
          for DEPLOY in "${COMPONENTS[@]}"; do
            echo "---"
            echo "🔍 Checking rollout status of $DEPLOY..."
            # Bonus: Ensure the deployment actually exists before checking status
            if ! kubectl get deployment "$DEPLOY" -n kyverno &>/dev/null; then
              echo "⚠️ Deployment '$DEPLOY' not found — skipping"
              continue
            fi
            # Rollout status with timeout and graceful fallback
            if ! kubectl rollout status deployment/"$DEPLOY" -n kyverno --timeout=60s; then
              echo "⚠️ '$DEPLOY' failed to become ready within the timeout"
            else
              echo "✅ '$DEPLOY' successfully rolled out"
            fi
          done
          echo "---"
          echo "📦 Final Kyverno pod snapshot:"
          kubectl get pods -n kyverno -o wide
      # ────────────────────────────────────────────────────────────────────────────────
      # 9.  Flux bootstrap per environment (skip if already done)
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Flux bootstrap for environment(s)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Used by flux bootstrap
        run: |
          set -euo pipefail
          for ENV in ${{ steps.envs.outputs.list }}; do
            echo ""
            echo "⚡ Checking if Flux already bootstrapped for '${ENV}'..."
            if kubectl get kustomization -n flux-system "${ENV}" 1>/dev/null 2>&1; then
              echo "✅ Flux already bootstrapped for '${ENV}' — skipping."
              continue
            fi
            echo "🚀 Bootstrapping Flux for '${ENV}'..."
            flux bootstrap github \
              --context=remote-cloudflare \
              --owner="${OWNER}" \
              --repository="${REPO}" \
              --branch="${ENV}" \
              --path="infrastructure/flux/flux-system/manifests" \
              --personal
          done
      # ────────────────────────────────────────────────────────────────────────────────
      # 10. Verify Flux reconciliation
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Verify Flux reconciliation
        run: flux get kustomizations --context=remote-cloudflare
