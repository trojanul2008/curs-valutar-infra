name: 🚀 Bootstrap Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to bootstrap (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm bootstrapping prod or both"
        required: false
        default: ""

jobs:
  bootstrap:
    name: Bootstrap GitOps stack
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      OWNER: trojanul2008
      REPO: curs-valutar-infra

      # wire your PAT into both GITHUB_TOKEN (for actions) and FLUX_GITHUB_TOKEN (for flux --token-auth)
      GITHUB_TOKEN: ${{ secrets.FLUX_SYSTEM_PAT }}
      FLUX_GITHUB_TOKEN: ${{ secrets.FLUX_SYSTEM_PAT }}

    steps:
      # 1.  Validate dispatch input (guardrail for prod / both)
      - name: Validate input
        id: validate
        run: |
          set -euo pipefail
          TARGET="${{ inputs.environment }}"
          CONFIRM="${{ inputs.confirm }}"
          echo "📍 Requested bootstrap: ${TARGET}"
          case "${TARGET}" in
            dev|prod|both) ;;
            *) echo "❌ Invalid environment '${TARGET}'. Must be dev, prod, or both."; exit 1 ;;
          esac
          if [[ "${TARGET}" != "dev" && "${CONFIRM}" != "YES" ]]; then
            echo "❌ Confirmation required to bootstrap '${TARGET}'. Aborting."
            exit 1
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      # 2.  Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.  Debug token presence (ensure the PAT is injected)
      - name: Debug token presence
        run: |
          echo "→ GITHUB_TOKEN present?      $( [ -z \"$GITHUB_TOKEN\" ] && echo no || echo yes )"
          echo "→ FLUX_GITHUB_TOKEN present? $( [ -z \"$FLUX_GITHUB_TOKEN\" ] && echo no || echo yes )"

      # 4.  Restore kubeconfig & verify access
      - name: Restore kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
          kubectl config use-context remote-cloudflare
          echo "🔑 Kubeconfig restored and context set: $(kubectl config current-context)"
      - name: Verify cluster access
        run: kubectl get nodes

      # 5.  Validate CLI version keys
      - name: Validate CLI version keys
        run: |
          chmod +x ./scripts/utils/validate-version-keys.sh
          ./scripts/utils/validate-version-keys.sh

      # 6.  Install required CLI tooling
      - name: Install CLI tools
        uses: ./.github/actions/tool-install

      # 7.  Figure out which environments to bootstrap
      - name: Set target environments
        id: envs
        run: |
          TARGET="${{ steps.validate.outputs.target }}"
          if [[ "$TARGET" == "both" ]]; then
            echo "list=dev prod" >> "$GITHUB_OUTPUT"
          else
            echo "list=${TARGET}" >> "$GITHUB_OUTPUT"
          fi

      # 8.  Ensure target namespaces exist
      - name: Create target namespaces
        run: |
          for NS in ${{ steps.envs.outputs.list }}; do
            echo "🔧 Ensuring namespace '${NS}' exists..."
            kubectl create ns "${NS}" 2>/dev/null || echo "✔️  Namespace '${NS}' already present"
          done

      # 9.  Install Kyverno (cluster-wide, idempotent)
      - name: Install Kyverno
        run: |
          set -euo pipefail
          helm repo add kyverno https://kyverno.github.io/kyverno/ >/dev/null
          helm repo update >/dev/null
          kubectl create ns kyverno 2>/dev/null || echo "✔️ Namespace 'kyverno' already present"
          helm upgrade --install kyverno kyverno/kyverno \
            --namespace kyverno \
            --set installCRDs=true \
            --wait \
            --timeout=300s \
            --no-hooks \
            --debug
          kubectl delete job kyverno-clean-reports -n kyverno || true

      - name: Verify Kyverno components
        run: |
          set -euo pipefail
          COMPONENTS=(
            kyverno-admission-controller
            kyverno-background-controller
            kyverno-cleanup-controller
            kyverno-reports-controller
          )
          echo "🧪 Starting Kyverno rollout verification..."
          SUCCESS=(); TIMEOUT=(); NOT_FOUND=()
          for DEPLOY in "${COMPONENTS[@]}"; do
            echo "---"
            echo "🔍 Checking rollout status of $DEPLOY..."
            if ! kubectl get deployment "$DEPLOY" -n kyverno &>/dev/null; then
              echo "⚠️ '$DEPLOY' not found — skipping"
              NOT_FOUND+=("$DEPLOY")
              continue
            fi
            if ! kubectl rollout status deployment/"$DEPLOY" -n kyverno --timeout=60s; then
              echo "⚠️ '$DEPLOY' timed out"
              TIMEOUT+=("$DEPLOY")
            else
              echo "✅ '$DEPLOY' rolled out"
              SUCCESS+=("$DEPLOY")
            fi
          done
          echo "---"
          echo "📦 Final Kyverno pod snapshot:"
          kubectl get pods -n kyverno -o wide
          echo ""
          echo "📊 Kyverno Rollout Summary:"
          printf "| %-35s | %-10s |\n" "Component" "Status"
          printf "|%s|%s|\n" "$(printf '%.0s-' {1..37})" "$(printf '%.0s-' {1..12})"
          for ITEM in "${SUCCESS[@]}";        do printf "| %-35s | ✅ Success   |\n" "$ITEM"; done
          for ITEM in "${TIMEOUT[@]}";        do printf "| %-35s | ⚠️ Timeout   |\n" "$ITEM"; done
          for ITEM in "${NOT_FOUND[@]}";      do printf "| %-35s | ❌ Not Found |\n" "$ITEM"; done
          echo "🚦 Rollout check complete."

      # 10.  Ensure flux-system namespace exists
      - name: Ensure flux-system namespace exists
        run: kubectl create namespace flux-system || echo "✔️ flux-system already exists"

      # 11.  Flux bootstrap per environment
      - name: Flux bootstrap for environment(s)
        run: |
          set -xeuo pipefail
          for ENV in ${{ steps.envs.outputs.list }}; do
            echo "⚡ Checking if Flux already bootstrapped for '${ENV}'…"
            if kubectl get kustomization -n flux-system "${ENV}" &>/dev/null; then
              echo "✅ Already bootstrapped for '${ENV}' — skipping."
              continue
            fi
            echo "🚀 Bootstrapping Flux for '${ENV}'…"
            flux bootstrap github \
              --context=remote-cloudflare \
              --owner="${OWNER}" \
              --repository="${REPO}" \
              --branch="${ENV}" \
              --path="infrastructure/flux/flux-system/manifests" \
              --personal \
              --token-auth \
              --log-level=debug
          done

      # 12.  Verify Flux reconciliation
      - name: Verify Flux reconciliation
        run: flux get kustomizations --context=remote-cloudflare
