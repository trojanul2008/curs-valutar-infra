name: 🚀 Bootstrap Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to bootstrap (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm bootstrapping prod/both"
        required: false
        default: ""
      run_verifications:
        description: "Run post-bootstrap verify steps (true/false)"
        required: false
        default: "true"

concurrency:
  group: bootstrap-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: GitOps Stack Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    env:
      OWNER: trojanul2008
      REPO: curs-valutar-infra
      GITHUB_TOKEN: ${{ secrets.FLUX_SYSTEM_PAT }}
      FLUX_GITHUB_TOKEN: ${{ secrets.FLUX_SYSTEM_PAT }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Mask sensitive secrets
        run: |
          echo "::add-mask::$GITHUB_TOKEN"
          echo "::add-mask::$FLUX_GITHUB_TOKEN"
          echo "::add-mask::${{ secrets.KUBE_CONFIG_DATA }}"

      - name: 🔧 Install CLI tools
        run: ./scripts/install/install-all.sh

      - name: 🧠 Validate environment inputs
        id: validate
        uses: ./.github/actions/validate-env
        with:
          environment: ${{ inputs.environment }}
          confirm: ${{ inputs.confirm }}

      - name: 🧩 Export mappings
        id: export
        uses: ./.github/actions/export-env-list
        with:
          target: ${{ steps.validate.outputs.target }}

      - name: 🧼 Lint scripts and workflows
        run: |
          shellcheck scripts/**/*.sh || echo "ShellCheck warnings"
          yamllint .github/**/*.yaml || echo "YAML lint warnings"

      - name: 🧪 Validate CLI versions
        run: ./scripts/utils/validate-version-keys.sh

      - name: 🔐 Restore kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: 🩺 Check cluster accessibility
        shell: bash
        run: |
          set -euo pipefail
          for ENV in ${{ steps.export.outputs.list }}; do
            CTX_VAR="CTX_${ENV}"
            CTX="${!CTX_VAR}"
            echo "🔑 [$ENV] Context: $CTX"
            kubectl --context="$CTX" get nodes -o wide
          done

      - name: 🔒 Ensure bootstrap script is executable
        run: chmod +x scripts/bootstrap/bootstrap-env.sh

      - name: ⏱️ Bootstrap per environment
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY=".bootstrap-summary"
          : > "$SUMMARY"
          for ENV in ${{ steps.export.outputs.list }}; do
            echo "::group::▶️ [$ENV] Bootstrap"
            CTX_VAR="CTX_${ENV}"; CTX="${!CTX_VAR:-}"
            BRANCH_VAR="BRANCH_${ENV}"; BRANCH="${!BRANCH_VAR:-}"
            PATH_VAR="PATH_${ENV}"; PATH_ARG="${!PATH_VAR:-}"
            if [[ -z "$CTX" || -z "$BRANCH" || -z "$PATH_ARG" ]]; then
              echo "❌ Missing mapping for $ENV (CTX='${CTX:-}', BRANCH='${BRANCH:-}', PATH='${PATH_ARG:-}')"
              exit 1
            fi
            START=$(date +%s)
            echo "• context=$CTX • branch=$BRANCH • path=$PATH_ARG"
            ./scripts/bootstrap/bootstrap-env.sh "$ENV" "$CTX" "$BRANCH" "$PATH_ARG"
            if [[ "${{ inputs.run_verifications }}" == "true" ]]; then
              echo "::group::🔒 [$ENV] Verifying Flux"
              ./scripts/verify/verify-flux.sh
              echo "::endgroup::"
              echo "::group::🛡️ [$ENV] Verifying Kyverno"
              ./scripts/verify/verify-kyverno.sh
              echo "::endgroup::"
              echo "::group::🌐 [$ENV] Verifying Traefik"
              ./scripts/verify/verify-traefik.sh
              echo "::endgroup::"
            else
              echo "🧪 Skipping post-bootstrap verifications (run_verifications=false)"
            fi
            END=$(date +%s)
            DURATION=$((END - START))
            printf "⏱️ • %-6s took %4ds\n" "$ENV" "$DURATION" >> "$SUMMARY"
            echo "::endgroup::"
          done
          mv "$SUMMARY" "$GITHUB_WORKSPACE/.bootstrap-summary"

      - name: 🧾 Tool versions
        run: |
          helm version --short
          kubectl version --client --short
          kustomize version
          flux --version
          yq --version
          trivy --version | head -n1
          kubeconform -v

      - name: 📝 Job summary
        if: always()
        run: |
          {
            echo "## Bootstrap summary"
            echo ""
            cat "$GITHUB_WORKSPACE/.bootstrap-summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📁 Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-snapshot-${{ steps.validate.outputs.target }}
          path: artifacts/bootstrap/
          retention-days: 7
          if-no-files-found: warn

      - name: 🧹 Optional cleanup
        if: always()
        run: rm -f ~/.kube/config || true

      - name: 🎉 Final confirmation
        run: echo "✅ Infrastructure bootstrapped successfully."
