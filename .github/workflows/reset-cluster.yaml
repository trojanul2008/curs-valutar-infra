name: "⚠️  Reset Cluster "

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both, and for FULL)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, webhook configs, PVs, etc.)"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      ADMIN_CTX: remote-cloudflare

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Validate inputs
        run: |
          NS="${{ inputs.namespace }}"
          CONF="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"
          if [[ "$NS" =~ ^(prod|both)$ && "$CONF" != "YES" ]]; then
            echo "❌ Type YES to wipe prod or both."; exit 1
          fi
          if [[ "$FULL" == "FULL" && "$CONF" != "YES" ]]; then
            echo "❌ Type YES for a FULL wipe."; exit 1
          fi
          echo "✅ Inputs ok: namespace=$NS, full=$FULL"

      - name: Decode kubeconfigs
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}" \
            | base64 --decode > ~/.kube/remote-config
          echo "${{ secrets.K3S_ADMIN_KUBECONFIG }}" \
            | base64 --decode > ~/.kube/admin-config

      - name: Debug secret lengths
        run: |
          echo -n "admin config bytes: "; echo -n "${{ secrets.K3S_ADMIN_KUBECONFIG }}" | wc -c
          echo -n "remote config bytes: "; echo -n "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}"   | wc -c

      - name: Expose merged KUBECONFIG for all steps
        run: |
          echo "KUBECONFIG=$HOME/.kube/remote-config:$HOME/.kube/admin-config" >> $GITHUB_ENV

      - name: Debug show all contexts
        run: |
          echo "--- available contexts ---"
          kubectl config get-contexts -o name

      - name: Patch remote cluster entry & skip TLS verify
        run: |
          kubectl --context=remote-cloudflare config set-cluster remote \
            --server=https://api.istartit.com:443 \
            --insecure-skip-tls-verify=true

      - name: Grant teardown-admin to cloudflare-user
        run: |
          kubectl --context=${{ env.ADMIN_CTX }} create clusterrolebinding teardown-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:cloudflare-user \
            --dry-run=client -o yaml \
          | kubectl --context=${{ env.ADMIN_CTX }} apply -f -

      - name: Wipe namespaces
        run: |
          set -euo pipefail
          set -x

          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          TARGETS=("$NS")
          [[ "$NS" == "both" ]] && TARGETS=(dev prod)
          [[ "$FULL" == "FULL" ]] && TARGETS+=(flux-system kyverno)

          echo "Deleting namespaces: ${TARGETS[*]}"
          for N in "${TARGETS[@]}"; do
            echo "=== processing namespace: $N ==="
            kubectl --context=${{ env.ADMIN_CTX }} delete ns "$N" \
              --ignore-not-found --wait=false

            for i in {1..30}; do
              echo " waiting for $N to disappear (attempt $i)"
              sleep 2
              ! kubectl --context=${{ env.ADMIN_CTX }} get ns "$N" &>/dev/null && break
            done

            echo "attempting finalizers cleanup for $N"
            RAW=$(kubectl --context=${{ env.ADMIN_CTX }} get ns "$N" -o json 2>/dev/null || echo "")
            echo "RAW JSON for $N: ${RAW:-<empty>}"

            if [[ -n "$RAW" ]]; then
              echo "$RAW" | jq .
              echo "$RAW" \
                | jq 'del(.spec.finalizers)' \
                | kubectl --context=${{ env.ADMIN_CTX }} \
                    replace --raw "/api/v1/namespaces/$N/finalize" -f -
            else
              echo " no raw JSON found for $N, skipping finalize"
            fi
          done

      - name: Clean residual namespaced resources
        run: |
          set -euo pipefail
          set -x

          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          LIST=("$NS")
          [[ "$NS" == "both" ]] && LIST=(dev prod)
          [[ "$FULL" == "FULL" ]] && LIST+=(flux-system kyverno)

          # Bail out after 3 minutes if this step hangs
          timeout 3m bash -c "
            for N in \"\${LIST[@]}\"; do
              echo \"=== cleaning namespaced resources in: \$N ===\"
              KINDS=\$(kubectl --context=${{ env.ADMIN_CTX }} \
                api-resources --namespaced=true --verbs=list -o name)
              echo \" Found kinds to sweep: \$KINDS\"

              for kind in \$KINDS; do
                echo \"  → checking \$kind in \$N\"
                RESOURCES=\$(kubectl --context=${{ env.ADMIN_CTX }} get \"\$kind\" \
                  -n \"\$N\" -o name 2>/dev/null || echo \"\")
                if [[ -n \"\$RESOURCES\" ]]; then
                  echo \"    found: \$RESOURCES\"
                  for res in \$RESOURCES; do
                    echo \"      force-deleting \$res\"
                    kubectl --context=${{ env.ADMIN_CTX }} delete \"\$res\" \
                      --force --grace-period=0 --ignore-not-found || \
                      echo \"        ❌ failed to force-delete \$res\"
                  done
                else
                  echo \"    no resources of type \$kind\"
                fi
              done
            done
          "

      - name: Strip stuck CRD finalizers
        if: ${{ inputs.full == 'FULL' }}
        run: |
          for crd in $(kubectl --context=${{ env.ADMIN_CTX }} get crd -o name); do
            kubectl --context=${{ env.ADMIN_CTX }} patch "$crd" \
              --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          done

      - name: Wipe cluster-scoped resources
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euo pipefail
          set -x

          echo "=== Deleting CRDs except k3s-managed ==="
          kubectl --context=${{ env.ADMIN_CTX }} get crd -o name | tee /tmp/crds.txt
          grep -v 'k3s.cattle.io' /tmp/crds.txt | while read crd; do
            echo " deleting $crd"
            kubectl --context=${{ env.ADMIN_CTX }} delete "$crd" \
              --ignore-not-found --timeout=60s || echo "  ❌ failed"
          done

          echo "=== Deleting webhook configurations ==="
          for w in mutatingwebhookconfiguration validatingwebhookconfiguration; do
            echo " deleting all $w"
            kubectl --context=${{ env.ADMIN_CTX }} delete "$w" \
              --all --ignore-not-found --timeout=30s || echo "  ❌ failed"
          done

          echo "=== Deleting selected APIService definitions ==="
          kubectl --context=${{ env.ADMIN_CTX }} get apiservice -o name \
            | tee /tmp/apiservices.txt
          grep -E '(helm|traffic|kyverno)' /tmp/apiservices.txt | while read apisvc; do
            echo " deleting $apisvc"
            kubectl --context=${{ env.ADMIN_CTX }} delete "$apisvc" \
              --ignore-not-found --timeout=30s || echo "  ❌ failed"
          done

          echo "=== Deleting all PersistentVolumes ==="
          kubectl --context=${{ env.ADMIN_CTX }} delete pv \
            --all --ignore-not-found --timeout=30s || true

          echo "=== Deleting storageclasses except local-path-storage ==="
          kubectl --context=${{ env.ADMIN_CTX }} get storageclass -o name \
            | tee /tmp/scs.txt
          grep -v 'local-path-storage' /tmp/scs.txt | while read sc; do
            echo " deleting $sc"
            kubectl --context=${{ env.ADMIN_CTX }} delete "$sc" \
              --ignore-not-found --timeout=30s || echo "  ❌ failed"
          done

      - name: Cleanup teardown-admin binding
        if: always()
        run: |
          kubectl --context=${{ env.ADMIN_CTX }} delete clusterrolebinding teardown-admin \
            --ignore-not-found
