name: "⚠️  Reset Cluster"

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod/both and FULL)"
        required: false
        default: ""
      full:
        description: "Type FULL to wipe cluster-scoped resources as well"
        required: false
        default: ""
      dry_run:
        description: "true to only list what would be deleted"
        required: false
        default: "false"

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      ADMIN_CTX: remote-cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Validate inputs
        run: |
          NS="${{ inputs.namespace }}"
          CONF="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"
          DRY="${{ inputs.dry_run }}"
          if [[ "$NS" =~ ^(prod|both)$ && "$CONF" != "YES" ]]; then
            echo "❌ Type YES to wipe prod/both."; exit 1
          fi
          if [[ "$FULL" == "FULL" && "$CONF" != "YES" ]]; then
            echo "❌ Type YES for a FULL wipe."; exit 1
          fi
          echo "✅ namespace=$NS full=$FULL dry_run=$DRY"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}" | base64 -d > ~/.kube/remote
          echo "${{ secrets.K3S_ADMIN_KUBECONFIG }}" | base64 -d > ~/.kube/admin
          echo "KUBECONFIG=$HOME/.kube/remote:$HOME/.kube/admin" >> $GITHUB_ENV

      - name: Helper choose delete command
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "DEL=echo DRY-RUN:" >> $GITHUB_ENV
          else
            echo "DEL=kubectl --context=${{ env.ADMIN_CTX }}" >> $GITHUB_ENV
          fi

      - name: Wipe namespaces
        run: |
          set -euxo pipefail
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          TARGETS=("$NS")
          [[ "$NS" == "both" ]] && TARGETS=(dev prod)
          [[ "$FULL" == "FULL" ]] && TARGETS+=(flux-system kyverno)

          for N in "${TARGETS[@]}"; do
            echo "🗑️  Namespace: $N"
            $DEL delete ns "$N" --ignore-not-found --wait=false
            for i in {1..30}; do
              sleep 2
              ! kubectl --context=${{ env.ADMIN_CTX }} get ns "$N" &>/dev/null && break
            done
            RAW=$(kubectl --context=${{ env.ADMIN_CTX }} get ns "$N" -o json 2>/dev/null || echo "")
            if [[ -n "$RAW" ]]; then
              echo " ⚙️  Finalizing $N"
              echo "$RAW" | jq 'del(.spec.finalizers)' \
                | kubectl --context=${{ env.ADMIN_CTX }} replace --raw "/api/v1/namespaces/$N/finalize" -f -
            fi
          done

      - name: Clean namespaced resources
        run: |
          set -euxo pipefail
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          LIST=("$NS")
          [[ "$NS" == "both" ]] && LIST=(dev prod)
          [[ "$FULL" == "FULL" ]] && LIST+=(flux-system kyverno)

          for N in "${LIST[@]}"; do
            echo "🔎 scanning resources in $N"
            for kind in $(kubectl api-resources --namespaced=true --verbs=list -o name); do
              RES=$(kubectl get "$kind" -n "$N" -o name 2>/dev/null || true)
              if [[ -n "$RES" ]]; then
                echo "  would delete ($kind):"
                echo "$RES" | sed 's/^/    /'
                echo "$RES" | xargs -I{} $DEL delete {} -n "$N" --force --grace-period=0 --ignore-not-found
              fi
            done
          done

      - name: Strip & delete CRDs, webhooks, APIServices, PVs, SCs
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euxo pipefail

          # 1) CRDs
          echo "🔎 all CRDs"
          ALL=$(kubectl get crd -o name)
          DEFAULT='k3s.cattle.io'
          NON=$(echo "$ALL" | grep -v "$DEFAULT" || true)
          echo "$NON" | sed 's/^/  delete /'
          echo "$NON" | xargs -I{} $DEL delete {} --ignore-not-found

          # 2) Webhooks
          for w in mutatingwebhookconfiguration validatingwebhookconfiguration; do
            echo "  delete webhook: $w"
            $DEL delete $w --all --ignore-not-found
          done

          # 3) APIService
          NONAPI=$(kubectl get apiservice -o name | grep -E '(helm|traffic|kyverno)' || true)
          echo "$NONAPI" | sed 's/^/  delete /'
          echo "$NONAPI" | xargs -I{} $DEL delete {} --ignore-not-found

          # 4) PVs
          echo "  delete pv --all"
          $DEL delete pv --all --ignore-not-found

          # 5) StorageClasses
          ALLSC=$(kubectl get sc -o name)
          NONSC=$(echo "$ALLSC" | grep -v 'local-path-storage' || true)
          echo "$NONSC" | sed 's/^/  delete /'
          echo "$NONSC" | xargs -I{} $DEL delete {} --ignore-not-found

      - name: Delete non-default ClusterRoleBindings
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euxo pipefail
          echo "🔎 all ClusterRoleBindings"
          ALL=$(kubectl get clusterrolebinding -o name)
          KEEP='^(cluster-admin|k3s|system:|teardown-admin)'
          BAD=$(echo "$ALL" | grep -Ev "$KEEP" || true)
          echo "$BAD" | sed 's/^/  delete /'
          echo "$BAD" | xargs -I{} $DEL delete {} --ignore-not-found

      - name: Delete non-default RoleBindings
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euxo pipefail
          echo "🔎 all RoleBindings"
          kubectl get rolebinding -A -o=custom-columns=NS:.metadata.namespace,NAME:.metadata.name --no-headers \
            | while read ns name; do
                if [[ "$name" =~ ^(system:|k3s|default|kube|extension) ]]; then
                  echo "  keeping $ns/$name"
                else
                  echo "  delete $ns/$name"
                  $DEL delete rolebinding "$name" -n "$ns" --ignore-not-found
                fi
              done

      - name: Cleanup teardown-admin binding
        if: always()
        run: |
          $DEL delete clusterrolebinding teardown-admin --ignore-not-found
