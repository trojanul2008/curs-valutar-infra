name: ⚠️  Reset Cluster

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (e.g. dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, Roles, PVs, etc.)"
        required: false
        default: ""

jobs:
  wipe-cluster:
    runs-on: ubuntu-latest

    # Paths where we’ll decode the two kubeconfigs
    env:
      CLOUD_KUBECONFIG: ${{ runner.temp }}/cloudflare.kubeconfig
      ADMIN_KUBECONFIG: ${{ runner.temp }}/admin.kubeconfig

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate inputs
        shell: bash
        run: |
          NAMESPACE="${{ inputs.namespace }}"
          CONFIRM="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"

          echo "📍 Namespace: ${NAMESPACE}"
          echo "📍 Full wipe?: ${FULL}"

          if [[ "$NAMESPACE" =~ ^(prod|both)$ && "$CONFIRM" != "YES" ]]; then
            echo "❌ Confirmation required to wipe prod or both. Aborting."
            exit 1
          fi

          if [[ "$FULL" == "FULL" && "$CONFIRM" != "YES" ]]; then
            echo "❌ Confirmation required for full cluster-scoped wipe. Aborting."
            exit 1
          fi

          echo "✅ Inputs validated."

      - name: Decode cloudflare-user kubeconfig
        shell: bash
        run: |
          mkdir -p "$(dirname "$CLOUD_KUBECONFIG")"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$CLOUD_KUBECONFIG"
          chmod 600 "$CLOUD_KUBECONFIG"
          echo "🔑 Cloudflare-user kubeconfig written to $CLOUD_KUBECONFIG"

      - name: Decode admin kubeconfig
        shell: bash
        run: |
          mkdir -p "$(dirname "$ADMIN_KUBECONFIG")"
          echo "${{ secrets.ADMIN_KUBECONFIG }}" | base64 --decode > "$ADMIN_KUBECONFIG"
          chmod 600 "$ADMIN_KUBECONFIG"
          echo "🔑 Admin kubeconfig written to $ADMIN_KUBECONFIG"

      - name: Sanity check access as cloudflare-user
        shell: bash
        run: |
          echo "🧠 Verifying user-level access…"
          kubectl --kubeconfig "$CLOUD_KUBECONFIG" get ns --no-headers
          echo "✅ Cloudflare-user can list namespaces."

      - name: Sanity check access as admin
        shell: bash
        run: |
          echo "🧠 Verifying admin-level access…"
          kubectl --kubeconfig "$ADMIN_KUBECONFIG" get ns --no-headers
          echo "✅ Admin kubeconfig valid."

      - name: Grant teardown-admin to cloudflare-user
        shell: bash
        run: |
          echo "🔒 Granting cluster-admin to default:cloudflare-user"
          kubectl --kubeconfig "$ADMIN_KUBECONFIG" create clusterrolebinding teardown-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:cloudflare-user \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "$ADMIN_KUBECONFIG" apply -f -

      - name: Wipe selected namespaces
        shell: bash
        run: |
          set -euo pipefail
          NAMESPACE="${{ inputs.namespace }}"
          if [[ "$NAMESPACE" == "both" ]]; then
            TARGET_NAMESPACES=(dev prod)
          else
            TARGET_NAMESPACES=("$NAMESPACE")
          fi

          for NS in "${TARGET_NAMESPACES[@]}"; do
            echo "🔄 Deleting namespace: $NS"
            kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete ns "$NS" --wait=false --ignore-not-found

            echo "⏳ Waiting up to 60s for $NS to vanish…"
            for i in {1..30}; do
              sleep 2
              if ! kubectl --kubeconfig "$CLOUD_KUBECONFIG" get ns "$NS" &>/dev/null; then
                echo "✅ $NS gone."
                break
              fi
              echo "  …still terminating"
            done

            if kubectl --kubeconfig "$CLOUD_KUBECONFIG" get ns "$NS" &>/dev/null; then
              echo "⚠️ $NS stuck in Terminating; stripping finalizers"
              RAW="$(kubectl --kubeconfig "$CLOUD_KUBECONFIG" get ns "$NS" -o json || true)"
              if [[ -n "$RAW" ]]; then
                echo "$RAW" | jq 'del(.spec.finalizers)' \
                  | kubectl --kubeconfig "$CLOUD_KUBECONFIG" replace --raw "/api/v1/namespaces/$NS/finalize" -f -
                echo "🗑️ $NS forced-deleted."
              else
                echo "❌ Could not fetch JSON for $NS"
              fi
            fi
          done

      - name: Clean up residual namespaced resources
        shell: bash
        run: |
          echo "🧹 Removing leftover namespaced objects"
          NAMESPACE="${{ inputs.namespace }}"
          if [[ "$NAMESPACE" == "both" ]]; then
            NS_LIST=(dev prod)
          else
            NS_LIST=("$NAMESPACE")
          fi

          for NS in "${NS_LIST[@]}"; do
            for kind in $(kubectl --kubeconfig "$CLOUD_KUBECONFIG" api-resources --namespaced=true --verbs=list -o name); do
              echo "  • Deleting $kind in $NS"
              kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete "$kind" -n "$NS" --all --ignore-not-found || true
            done
          done
          echo "✅ Namespaced wipe complete."

      - name: Strip finalizers on stuck CRDs
        if: ${{ inputs.full == 'FULL' }}
        shell: bash
        run: |
          echo "✂️ Removing finalizers from CRDs"
          for crd in $(kubectl --kubeconfig "$CLOUD_KUBECONFIG" get crd -o name); do
            kubectl --kubeconfig "$CLOUD_KUBECONFIG" patch "$crd" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          done

      - name: Wipe cluster-scoped resources
        if: ${{ inputs.full == 'FULL' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "🗑️ Deleting all CRDs"
          kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete crd --all --ignore-not-found --timeout=60s || true
          echo "🔍 Remaining CRDs:"
          kubectl --kubeconfig "$CLOUD_KUBECONFIG" get crd -o name || echo "(none)"

          echo "🗑️ Cleaning up ClusterRoles & Bindings"
          DEFAULT=(cluster-admin admin edit view)
          for r in $(kubectl --kubeconfig "$CLOUD_KUBECONFIG" get clusterrole -o name); do
            name=${r#*/}
            [[ " ${DEFAULT[*]} " =~ " $name " ]] || \
              kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete clusterrole "$name" --ignore-not-found --timeout=30s
          done
          for b in $(kubectl --kubeconfig "$CLOUD_KUBECONFIG" get clusterrolebinding -o name); do
            name=${b#*/}
            [[ " ${DEFAULT[*]} " =~ " $name " ]] || \
              kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete clusterrolebinding "$name" --ignore-not-found --timeout=30s
          done

          echo "🗑️ Deleting webhooks & APIs"
          kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete mutatingwebhookconfiguration,validatingwebhookconfiguration,apiservice \
            --all --ignore-not-found --timeout=30s

          echo "🗑️ Deleting PersistentVolumes"
          kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete pv --all --ignore-not-found --timeout=30s

          echo "🗑️ Deleting non-default StorageClasses"
          kubectl --kubeconfig "$CLOUD_KUBECONFIG" get storageclass -o name \
            | grep -v 'local-path-storage' \
            | xargs -r kubectl --kubeconfig "$CLOUD_KUBECONFIG" delete --ignore-not-found --timeout=30s

          echo "✅ Cluster-scoped wipe complete."

      - name: Cleanup temporary binding
        if: ${{ inputs.full == 'FULL' }}
        shell: bash
        run: |
          echo "🧹 Removing teardown-admin binding"
          kubectl --kubeconfig "$ADMIN_KUBECONFIG" delete clusterrolebinding teardown-admin --ignore-not-found || true
