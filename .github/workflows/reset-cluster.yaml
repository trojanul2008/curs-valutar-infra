name: "⚠️  Reset Cluster"

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both, and for FULL)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, webhook configs, PVs, etc.)"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Validate inputs
        run: |
          NS="${{ inputs.namespace }}"
          CONF="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"

          if [[ "$NS" =~ ^(prod|both)$ && "$CONF" != "YES" ]]; then
            echo "❌ Type YES to wipe prod or both."; exit 1
          fi
          if [[ "$FULL" == "FULL" && "$CONF" != "YES" ]]; then
            echo "❌ Type YES for a FULL wipe."; exit 1
          fi
          echo "✅ Inputs ok: namespace=$NS, full=$FULL"

      - name: Decode kubeconfigs
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" \
            | base64 --decode > ~/.kube/user-config
          echo "${{ secrets.ADMIN_KUBECONFIG }}" \
            | base64 --decode > ~/.kube/admin-config
          chmod 600 ~/.kube/user-config ~/.kube/admin-config

      - name: Patch admin-config to skip TLS verify
        run: |
          kubectl --kubeconfig ~/.kube/admin-config \
            config set-cluster default \
            --server=https://api.istartit.com:443 \
            --insecure-skip-tls-verify=true

      - name: Grant teardown-admin to cloudflare-user
        run: |
          kubectl --kubeconfig ~/.kube/admin-config create clusterrolebinding teardown-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:cloudflare-user \
            --dry-run=client -o yaml \
          | kubectl --kubeconfig ~/.kube/admin-config apply --validate=false -f -

      - name: Wipe namespaces
        run: |
          set -euo pipefail

          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          TARGETS=("$NS")
          [[ "$NS" == "both" ]] && TARGETS=(dev prod)

          if [[ "$FULL" == "FULL" ]]; then
            TARGETS+=(flux-system kyverno)
          fi

          echo "Deleting namespaces: ${TARGETS[*]}"
          for N in "${TARGETS[@]}"; do
            kubectl --kubeconfig ~/.kube/user-config delete ns "$N" \
              --ignore-not-found --wait=false

            for i in {1..30}; do
              sleep 2
              ! kubectl --kubeconfig ~/.kube/user-config get ns "$N" &>/dev/null && break
            done

            if kubectl --kubeconfig ~/.kube/user-config get ns "$N" &>/dev/null; then
              RAW=$(kubectl --kubeconfig ~/.kube/user-config get ns "$N" -o json)
              echo "$RAW" \
                | jq 'del(.spec.finalizers)' \
                | kubectl --kubeconfig ~/.kube/user-config \
                    replace --raw "/api/v1/namespaces/$N/finalize" -f -
            fi
          done

      - name: Clean residual namespaced resources
        run: |
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          LIST=("$NS")
          [[ "$NS" == "both" ]] && LIST=(dev prod)

          if [[ "$FULL" == "FULL" ]]; then
            LIST+=(flux-system kyverno)
          fi

          for N in "${LIST[@]}"; do
            for kind in $(kubectl --kubeconfig ~/.kube/user-config \
              api-resources --namespaced=true --verbs=list -o name); do
              kubectl --kubeconfig ~/.kube/user-config delete "$kind" \
                -n "$N" --all --ignore-not-found || true
            done
          done

      - name: Strip stuck CRD finalizers
        if: ${{ inputs.full == 'FULL' }}
        run: |
          for crd in $(kubectl --kubeconfig ~/.kube/user-config get crd -o name); do
            kubectl --kubeconfig ~/.kube/user-config patch "$crd" \
              --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          done

      - name: Wipe cluster-scoped resources
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euo pipefail

          echo "Deleting all CRDs except k3s-managed ones"
          kubectl --kubeconfig ~/.kube/user-config get crd -o name \
            | grep -v 'k3s.cattle.io' \
            | xargs -r kubectl --kubeconfig ~/.kube/user-config delete \
                --ignore-not-found --timeout=60s

          echo "Deleting webhook configurations"
          kubectl --kubeconfig ~/.kube/user-config delete \
            mutatingwebhookconfiguration,validatingwebhookconfiguration \
            --all --ignore-not-found --timeout=30s

          echo "Deleting selected APIService definitions"
          kubectl --kubeconfig ~/.kube/user-config get apiservice -o name \
            | grep -E '(helm|traffic|kyverno)' \
            | xargs -r kubectl --kubeconfig ~/.kube/user-config delete \
                --ignore-not-found --timeout=30s

          echo "Deleting all PersistentVolumes"
          kubectl --kubeconfig ~/.kube/user-config delete pv \
            --all --ignore-not-found --timeout=30s

          echo "Deleting storageclasses except local-path-storage"
          kubectl --kubeconfig ~/.kube/user-config get storageclass -o name \
            | grep -v 'local-path-storage' \
            | xargs -r kubectl --kubeconfig ~/.kube/user-config delete \
                --ignore-not-found --timeout=30s
