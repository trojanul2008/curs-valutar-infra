name: ⚠️ Reset Cluster

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (e.g. dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, Roles, PVs, etc.)"
        required: false
        default: ""

jobs:
  wipe-cluster:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate inputs
        run: |
          NS="${{ inputs.namespace }}"
          CONFIRM="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"

          echo "📍 Namespace: ${NS}"
          echo "📍 Full wipe?: ${FULL}"

          if [[ "${NS}" =~ ^(prod|both)$ && "${CONFIRM}" != "YES" ]]; then
            echo "❌ Need YES to wipe prod or both. Aborting."
            exit 1
          fi

          if [[ "${FULL}" == "FULL" && "${CONFIRM}" != "YES" ]]; then
            echo "❌ Need YES for full cluster wipe. Aborting."
            exit 1
          fi

          echo "✅ Inputs are valid."

      - name: Prepare kubeconfigs
        run: |
          mkdir -p ~/.kube

          echo "${{ secrets.KUBE_CONFIG_DATA }}" \
            | base64 --decode > ~/.kube/user-config

          echo "${{ secrets.ADMIN_KUBECONFIG }}" \
            | base64 --decode > ~/.kube/admin-config

          chmod 600 ~/.kube/user-config ~/.kube/admin-config
          echo "🔑 Kubeconfigs decoded to ~/.kube/"

      - name: Sanity check user access
        run: |
          echo "🧠 Verifying cloudflare-user permissions…"
          kubectl --kubeconfig ~/.kube/user-config get ns --no-headers

      - name: Sanity check admin access
        run: |
          echo "🧠 Verifying admin permissions…"
          kubectl --kubeconfig ~/.kube/admin-config get ns --no-headers

      - name: Grant teardown-admin to cloudflare-user
        run: |
          echo "🔒 Granting cluster-admin to default:cloudflare-user"
          kubectl --kubeconfig ~/.kube/admin-config create clusterrolebinding teardown-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:cloudflare-user \
            --dry-run=client -o yaml \
          | kubectl --kubeconfig ~/.kube/admin-config apply -f -

      - name: Wipe selected namespaces
        run: |
          set -euo pipefail
          NS="${{ inputs.namespace }}"

          if [[ "${NS}" == "both" ]]; then
            TARGETS=(dev prod)
          else
            TARGETS=("${NS}")
          fi

          for N in "${TARGETS[@]}"; do
            echo "🔄 Deleting namespace: ${N}"
            kubectl --kubeconfig ~/.kube/user-config delete ns "${N}" \
              --wait=false --ignore-not-found

            echo "⏳ Waiting up to 60s for ${N} to terminate…"
            for i in {1..30}; do
              sleep 2
              kubectl --kubeconfig ~/.kube/user-config get ns "${N}" &>/dev/null \
                || { echo "✅ ${N} deleted."; break; }
              echo "  …still terminating"
            done

            if kubectl --kubeconfig ~/.kube/user-config get ns "${N}" &>/dev/null; then
              echo "⚠️ ${N} stuck—removing finalizers"
              RAW=$(kubectl --kubeconfig ~/.kube/user-config get ns "${N}" -o json || true)
              if [[ -n "${RAW}" ]]; then
                echo "${RAW}" \
                  | jq 'del(.spec.finalizers)' \
                  | kubectl --kubeconfig ~/.kube/user-config \
                      replace --raw "/api/v1/namespaces/${N}/finalize" -f -
                echo "🗑️ ${N} forced-deleted."
              else
                echo "❌ Could not fetch JSON for ${N}"
              fi
            fi
          done

      - name: Clean up residual namespaced resources
        run: |
          echo "🧹 Deleting leftover namespaced objects"
          NS="${{ inputs.namespace }}"
          if [[ "${NS}" == "both" ]]; then
            LIST=(dev prod)
          else
            LIST=("${NS}")
          fi

          for N in "${LIST[@]}"; do
            for kind in $(kubectl --kubeconfig ~/.kube/user-config \
              api-resources --namespaced=true --verbs=list -o name); do

              echo "  • Clearing ${kind} in ${N}"
              kubectl --kubeconfig ~/.kube/user-config delete "${kind}" \
                -n "${N}" --all --ignore-not-found || true
            done
          done

      - name: Strip CRD finalizers
        if: ${{ inputs.full == 'FULL' }}
        run: |
          echo "✂️ Removing finalizers from CRDs"
          for crd in $(kubectl --kubeconfig ~/.kube/user-config get crd -o name); do
            kubectl --kubeconfig ~/.kube/user-config patch "${crd}" \
              --type=merge -p '{"metadata":{"finalizers":[]}}' \
              || true
          done

      - name: Wipe cluster-scoped resources
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euo pipefail

          echo "🗑️ Deleting all CRDs"
          kubectl --kubeconfig ~/.kube/user-config delete crd \
            --all --ignore-not-found --timeout=60s || true

          echo "🗑️ Cleaning ClusterRoles & Bindings"
          DEFAULT=(cluster-admin admin edit view)
          for r in $(kubectl --kubeconfig ~/.kube/user-config get clusterrole -o name); do
            n=${r#*/}
            [[ " ${DEFAULT[*]} " =~ " ${n} " ]] || \
              kubectl --kubeconfig ~/.kube/user-config delete "${r}" \
                --ignore-not-found --timeout=30s
          done

          for b in $(kubectl --kubeconfig ~/.kube/user-config get clusterrolebinding -o name); do
            n=${b#*/}
            [[ " ${DEFAULT[*]} " =~ " ${n} " ]] || \
              kubectl --kubeconfig ~/.kube/user-config delete "${b}" \
                --ignore-not-found --timeout=30s
          done

          echo "🗑️ Deleting webhooks & APIService"
          kubectl --kubeconfig ~/.kube/user-config delete \
            mutatingwebhookconfiguration,validatingwebhookconfiguration,apiservice \
            --all --ignore-not-found --timeout=30s

          echo "🗑️ Deleting PersistentVolumes"
          kubectl --kubeconfig ~/.kube/user-config delete pv \
            --all --ignore-not-found --timeout=30s

          echo "🗑️ Deleting non-default StorageClasses"
          kubectl --kubeconfig ~/.kube/user-config get storageclass -o name \
            | grep -v 'local-path-storage' \
            | xargs -r kubectl --kubeconfig ~/.kube/user-config delete \
                --ignore-not-found --timeout=30s

      - name: Cleanup teardown-admin binding
        if: ${{ inputs.full == 'FULL' }}
        run: |
          echo "🧹 Removing teardown-admin binding"
          kubectl --kubeconfig ~/.kube/admin-config delete \
            clusterrolebinding teardown-admin --ignore-not-found || true
