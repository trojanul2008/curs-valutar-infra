name: "⚠️  Reset Cluster "

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both, and for FULL)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, webhook configs, PVs, etc.)"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: $HOME/.kube/config
      ADMIN_CTX: k3s-admin

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest
      - name: Validate inputs
        run: |
          NS="${{ inputs.namespace }}"
          CONF="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"
          if [[ "$NS" =~ ^(prod|both)$ && "$CONF" != "YES" ]]; then
            echo "❌ Type YES to wipe prod or both."; exit 1
          fi
          if [[ "$FULL" == "FULL" && "$CONF" != "YES" ]]; then
            echo "❌ Type YES for a FULL wipe."; exit 1
          fi
          echo "✅ Inputs ok: namespace=$NS, full=$FULL"
      - name: Decode & merge kubeconfigs
        run: |
          mkdir -p ~/.kube
          if [[ -z "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}" ]]; then
            echo "❌ Missing KUBE_CONFIG_CLOUDFLARE secret"; exit 1
          fi
          if [[ -z "${{ secrets.K3S_ADMIN_KUBECONFIG }}" ]]; then
            echo "❌ Missing K3S_ADMIN_KUBECONFIG secret"; exit 1
          fi
          echo "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}" \
            | base64 --decode > ~/.kube/remote-config
          echo "${{ secrets.K3S_ADMIN_KUBECONFIG }}" \
            | base64 --decode > ~/.kube/admin-config
          KUBECONFIG=~/.kube/remote-config:~/.kube/admin-config \
            kubectl config view --flatten > ~/.kube/config
          chmod 600 ~/.kube/config
          #      - name: Decode & merge kubeconfigs
          #        run: |
          #          mkdir -p ~/.kube
          #          # Decode remote-cloudflare
          #          echo "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}" \
          #            | base64 --decode > ~/.kube/remote-config
          #          # Decode k3s-admin
          #          echo "${{ secrets.K3S_ADMIN_KUBECONFIG }}" \
          #            | base64 --decode > ~/.kube/admin-config
          #          # Merge into one flat config
          #          KUBECONFIG=~/.kube/remote-config:~/.kube/admin-config \
          #            kubectl config view --flatten > ~/.kube/config
          #          chmod 600 ~/.kube/config
      - name: Debug show all contexts
        run: |
          echo "--- kubectl config view ---"
          kubectl config view --minify=false
          echo "--- available contexts ---"
          kubectl config get-contexts -o name
      - name: Patch remote cluster entry & skip TLS verify
        run: |
          kubectl --context=remote-cloudflare config set-cluster remote \
            --server=https://api.istartit.com:443 \
            --insecure-skip-tls-verify=true
      - name: Grant teardown-admin to cloudflare-user
        run: |
          kubectl --context=${{ env.ADMIN_CTX }} create clusterrolebinding teardown-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:cloudflare-user \
            --dry-run=client -o yaml \
          | kubectl --context=${{ env.ADMIN_CTX }} apply -f -
      - name: Wipe namespaces
        run: |
          set -euo pipefail
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          TARGETS=("$NS")
          [[ "$NS" == "both" ]] && TARGETS=(dev prod)
          [[ "$FULL" == "FULL" ]] && TARGETS+=(flux-system kyverno)
          echo "Deleting namespaces: ${TARGETS[*]}"
          for N in "${TARGETS[@]}"; do
            kubectl --context=remote-cloudflare delete ns "$N" \
              --ignore-not-found --wait=false
            for i in {1..30}; do
              sleep 2
              ! kubectl --context=remote-cloudflare get ns "$N" &>/dev/null && break
            done
            if kubectl --context=remote-cloudflare get ns "$N" &>/dev/null; then
              RAW=$(kubectl --context=remote-cloudflare get ns "$N" -o json)
              echo "$RAW" \
                | jq 'del(.spec.finalizers)' \
                | kubectl --context=remote-cloudflare \
                    replace --raw "/api/v1/namespaces/$N/finalize" -f -
            fi
          done
      - name: Clean residual namespaced resources
        run: |
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          LIST=("$NS")
          [[ "$NS" == "both" ]] && LIST=(dev prod)
          [[ "$FULL" == "FULL" ]] && LIST+=(flux-system kyverno)
          for N in "${LIST[@]}"; do
            for kind in $(kubectl --context=remote-cloudflare \
              api-resources --namespaced=true --verbs=list -o name); do
              kubectl --context=remote-cloudflare delete "$kind" \
                -n "$N" --all --ignore-not-found || true
            done
          done
      - name: Strip stuck CRD finalizers
        if: ${{ inputs.full == 'FULL' }}
        run: |
          for crd in $(kubectl --context=remote-cloudflare get crd -o name); do
            kubectl --context=remote-cloudflare patch "$crd" \
              --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          done
      - name: Wipe cluster-scoped resources
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euo pipefail
          echo "Deleting CRDs except k3s-managed"
          kubectl --context=remote-cloudflare get crd -o name \
            | grep -v 'k3s.cattle.io' \
            | xargs -r kubectl --context=remote-cloudflare delete \
                --ignore-not-found --timeout=60s
          echo "Deleting webhook configurations"
          kubectl --context=remote-cloudflare delete \
            mutatingwebhookconfiguration,validatingwebhookconfiguration \
            --all --ignore-not-found --timeout=30s
          echo "Deleting selected APIService definitions"
          kubectl --context=remote-cloudflare get apiservice -o name \
            | grep -E '(helm|traffic|kyverno)' \
            | xargs -r kubectl --context=remote-cloudflare delete \
                --ignore-not-found --timeout=30s
          echo "Deleting all PersistentVolumes"
          kubectl --context=remote-cloudflare delete pv \
            --all --ignore-not-found --timeout=30s
          echo "Deleting storageclasses except local-path-storage"
          kubectl --context=remote-cloudflare get storageclass -o name \
            | grep -v 'local-path-storage' \
            | xargs -r kubectl --context=remote-cloudflare delete \
                --ignore-not-found --timeout=30s
      - name: Cleanup teardown-admin binding
        if: always()
        run: |
          kubectl --context=${{ env.ADMIN_CTX }} delete clusterrolebinding teardown-admin \
            --ignore-not-found
