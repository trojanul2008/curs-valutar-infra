name: ⚠️  Reset Cluster

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (e.g. dev or prod)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm full deletion"
        required: true
        default: ""

jobs:
  wipe-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.confirm }}" != "YES" ]]; then
            echo "❌ Deletion not confirmed. Aborting."
            exit 1
          fi
          echo "✅ Confirmed wipe of namespace '${{ inputs.namespace }}'"
      - name: Restore kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          kubectl config use-context remote-cloudflare
          echo "🔑 Kubeconfig restored and context set."
      - name: Sanity check cluster connection
        run: |
          echo "🧠 Checking current context and cluster connectivity…"
          kubectl config current-context
          kubectl get ns
          echo "✅ Cluster access verified."
      - name: Wipe namespace and related resources
        run: |
          set -euo pipefail
          NAMESPACE="${{ inputs.namespace }}"
          echo "🔄 Starting full wipe of namespace '${NAMESPACE}'"
          echo "💣 Deleting namespace '${NAMESPACE}'"
          kubectl delete ns "${NAMESPACE}" --wait=false --ignore-not-found
          echo "⏳ Waiting for deletion to complete (up to 60s)…"
          for i in {1..30}; do
            sleep 2
            kubectl get ns "${NAMESPACE}" &>/dev/null || {
              echo "✅ Namespace '${NAMESPACE}' deleted."
              exit 0
            }
            echo "  …still terminating"
          done
          echo "⚠️ Namespace stuck in Terminating — inspecting finalizers"
          RAW_NS_JSON=$(kubectl get ns "${NAMESPACE}" -o json || echo "")
          if [[ -z "${RAW_NS_JSON}" ]]; then
            echo "❌ Unable to retrieve namespace JSON. Skipping finalizer removal."
            exit 1
          fi
          echo "🔬 Raw namespace JSON:"
          echo "${RAW_NS_JSON}" | jq .

          echo "🔧 Removing finalizers..."
          echo "${RAW_NS_JSON}" \
            | jq 'del(.spec.finalizers)' \
            | kubectl replace --raw "/api/v1/namespaces/${NAMESPACE}/finalize" -f -
          echo "🗑️ Namespace '${NAMESPACE}' forced-deleted."
      - name: Clean up residual resources
        run: |
          echo "🧹 Checking for remaining namespaced resources tied to '${{ inputs.namespace }}'"
          for kind in $(kubectl api-resources --namespaced=true --verbs=list -o name); do
            echo "  • Removing ${kind} in '${{ inputs.namespace }}'"
            kubectl delete "$kind" -n "${{ inputs.namespace }}" --all --wait --ignore-not-found || true
          done
          echo "✅ Wipe completed."
