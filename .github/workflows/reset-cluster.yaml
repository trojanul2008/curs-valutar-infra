name: "⚠️  Reset Cluster "

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both, and for FULL)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, webhook configs, PVs, etc.)"
        required: false
        default: ""

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      ADMIN_CTX: remote-cloudflare
      DRY_RUN: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Validate inputs
        run: |
          NS="${{ inputs.namespace }}"
          CONF="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"
          if [[ "$NS" =~ ^(prod|both)$ && "$CONF" != "YES" ]]; then
            echo "❌ Type YES to wipe prod or both."; exit 1
          fi
          if [[ "$FULL" == "FULL" && "$CONF" != "YES" ]]; then
            echo "❌ Type YES for a FULL wipe."; exit 1
          fi
          echo "✅ Inputs ok: namespace=$NS, full=$FULL, dry-run=$DRY_RUN"

      - name: Decode kubeconfigs
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_CLOUDFLARE }}" | base64 --decode > ~/.kube/remote-config
          echo "${{ secrets.K3S_ADMIN_KUBECONFIG }}"   | base64 --decode > ~/.kube/admin-config

      - name: Expose merged KUBECONFIG for all steps
        run: |
          echo "KUBECONFIG=$HOME/.kube/remote-config:$HOME/.kube/admin-config" >> $GITHUB_ENV

      - name: Debug show contexts
        run: |
          echo "--- available contexts ---"
          kubectl config get-contexts -o name

      - name: Patch remote cluster entry & skip TLS verify
        run: |
          kubectl --context=remote-cloudflare config set-cluster remote \
            --server=https://api.istartit.com:443 \
            --insecure-skip-tls-verify=true

      - name: Grant teardown-admin to cloudflare-user
        run: |
          kubectl --context="${{ env.ADMIN_CTX }}" create clusterrolebinding teardown-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:cloudflare-user \
            --dry-run=client -o yaml \
          | kubectl --context="${{ env.ADMIN_CTX }}" apply -f -

      - name: Wipe namespaces
        run: |
          set -euo pipefail
          set -x
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          TARGETS=("$NS")
          [[ "$NS" == "both" ]]     && TARGETS=(dev prod)
          [[ "$FULL" == "FULL" ]]   && TARGETS+=(flux-system kyverno)

          echo "Deleting namespaces: ${TARGETS[*]}"
          for N in "${TARGETS[@]}"; do
            echo "=== processing namespace: $N ==="
            kubectl --context="${{ env.ADMIN_CTX }}" delete ns "$N" \
              --ignore-not-found --wait=false

            for i in {1..30}; do
              echo " waiting for $N to disappear (attempt $i)"
              sleep 2
              ! kubectl --context="${{ env.ADMIN_CTX }}" get ns "$N" &>/dev/null && break
            done

            echo "Attempting finalizers cleanup for $N"
            RAW=$(kubectl --context="${{ env.ADMIN_CTX }}" get ns "$N" -o json 2>/dev/null || echo "")
            if [[ -n "$RAW" ]]; then
              echo "$RAW" | jq .
              echo "$RAW" \
                | jq 'del(.spec.finalizers)' \
                | kubectl --context="${{ env.ADMIN_CTX }}" \
                    replace --raw "/api/v1/namespaces/$N/finalize" -f -
            else
              echo " no raw JSON found for $N, skipping finalize"
            fi
          done

      - name: Clean residual namespaced resources
        run: |
          set -euo pipefail
          set -x
          NS="${{ inputs.namespace }}"
          FULL="${{ inputs.full }}"
          LIST=("$NS")
          [[ "$NS" == "both" ]]     && LIST=(dev prod)
          [[ "$FULL" == "FULL" ]]   && LIST+=(flux-system kyverno)

          timeout 3m bash -c "
            for N in \"\${LIST[@]}\"; do
              echo \"=== cleaning namespaced resources in: \$N ===\"
              for kind in \$(kubectl --context=${{ env.ADMIN_CTX }} \
                api-resources --namespaced=true --verbs=list -o name); do

                echo \"  → checking \$kind in \$N\"
                RES=\$(kubectl --context=${{ env.ADMIN_CTX }} get \$kind -n \$N -o name 2>/dev/null || echo "")
                if [[ -n \"\$RES\" ]]; then
                  echo \"    found: \$RES\"
                  for r in \$RES; do
                    echo \"      force-deleting \$r\"
                    kubectl --context=${{ env.ADMIN_CTX }} delete \$r \
                      --force --grace-period=0 --ignore-not-found || true
                  done
                fi
              done
            done
          "

      - name: Strip stuck CRD finalizers
        if: ${{ inputs.full == 'FULL' }}
        run: |
          for crd in $(kubectl --context=${{ env.ADMIN_CTX }} get crd -o name); do
            kubectl --context=${{ env.ADMIN_CTX }} patch "$crd" \
              --type=merge -p '{"metadata":{"finalizers":[]}}' || true
          done

      - name: Wipe cluster-scoped resources
        if: ${{ inputs.full == 'FULL' }}
        run: |
          set -euo pipefail
          set -x

          # CRDs
          echo "=== Deleting CRDs except k3s-managed ==="
          ALL_CRDS=$(kubectl --context=${{ env.ADMIN_CTX }} get crd -o name)
          TO_DELETE_CRDS=$(echo "$ALL_CRDS" | grep -v 'k3s.cattle.io' || true)
          for crd in $TO_DELETE_CRDS; do
            echo " deleting CRD: $crd"
            [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete "$crd" --ignore-not-found --timeout=60s
          done

          # Webhooks
          echo "=== Deleting webhook configurations ==="
          for w in mutatingwebhookconfiguration validatingwebhookconfiguration; do
            echo " deleting all $w"
            [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete "$w" --all --ignore-not-found --timeout=30s
          done

          # APIService
          echo "=== Deleting selected APIService definitions ==="
          APISVCS=$(kubectl --context=${{ env.ADMIN_CTX }} get apiservice -o name \
                    | grep -E '(helm|traffic|kyverno)' || true)
          for svc in $APISVCS; do
            echo " deleting APIService: $svc"
            [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete "$svc" --ignore-not-found --timeout=30s
          done

          # PersistentVolumes
          echo "=== Deleting all PersistentVolumes ==="
          [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete pv --all --ignore-not-found --timeout=30s

          # StorageClasses
          echo "=== Deleting storageclasses except local-path-storage ==="
          ALL_SCS=$(kubectl --context=${{ env.ADMIN_CTX }} get storageclass -o name)
          TO_DELETE_SCS=$(echo "$ALL_SCS" | grep -v 'local-path-storage' || true)
          for sc in $TO_DELETE_SCS; do
            echo " deleting SC: $sc"
            [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete "$sc" --ignore-not-found --timeout=30s
          done

          # ClusterRoleBindings
          echo "=== Deleting non-standard ClusterRoleBindings ==="
          KEEP_CRBS=(
            cluster-admin
            k3s-cloud-controller-manager
            k3s-cloud-controller-manager-auth-delegator
            kube-apiserver-kubelet-admin
            cloudflare-user-basic
            cloudflare-user-cluster-admin
            clustercidrs-node
            local-path-provisioner-bind
            metrics-server:system:auth-delegator
            remote-admin-binding
          )
          for crb in $(kubectl --context=${{ env.ADMIN_CTX }} get clusterrolebinding -o name); do
            name=$(basename "$crb")
            if [[ " ${KEEP_CRBS[*]} " =~ " ${name} " ]]; then
              echo " keeping CRB: $crb"
            else
              echo " deleting CRB: $crb"
              [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete "$crb" --ignore-not-found --timeout=20s
            fi
          done

          # RoleBindings
          echo "=== Deleting non-standard RoleBindings ==="
          KEEP_RBS=(
            default/github-runner-edit
            kube-system/metrics-server-auth-reader
            kube-system/system:.*
            kube-system/k3s:.*
            kube-system/extension:.*
            remote-admin-binding
          )
          while read -r ns name; do
            full="$ns/$name"
            keep=false
            for pat in "${KEEP_RBS[@]}"; do
              if [[ "$full" =~ ^$pat$ ]]; then
                keep=true
                break
              fi
            done
            if $keep; then
              echo " keeping RB: $full"
            else
              echo " deleting RB: $full"
              [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" -n "$ns" delete rolebinding "$name" --ignore-not-found --timeout=20s
            fi
          done < <(kubectl --context=${{ env.ADMIN_CTX }} get rolebinding -A -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name" --no-headers)

      - name: Cleanup teardown-admin binding
        if: always()
        run: |
          [[ "$DRY_RUN" == "true" ]] || kubectl --context="${{ env.ADMIN_CTX }}" delete clusterrolebinding teardown-admin --ignore-not-found
