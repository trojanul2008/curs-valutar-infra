name: ⚠️ Reset Cluster

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (e.g. dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, Roles, PVs, etc.)"
        required: false
        default: ""

jobs:
  wipe-cluster:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        run: |
          NAMESPACE="${{ inputs.namespace }}"
          CONFIRM="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"

          echo "📍 Namespace: ${NAMESPACE}"
          echo "📍 Full wipe?: ${FULL}"

          if [[ "$NAMESPACE" =~ ^(prod|both)$ && "$CONFIRM" != "YES" ]]; then
            echo "❌ Confirmation required to wipe prod or both. Aborting."
            exit 1
          fi

          if [[ "$FULL" == "FULL" && "$CONFIRM" != "YES" ]]; then
            echo "❌ Confirmation required for full cluster-scoped wipe. Aborting."
            exit 1
          fi

          echo "✅ Inputs validated."

      - name: Restore kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          kubectl config use-context remote-cloudflare
          echo "🔑 Kubeconfig restored and context set."

      - name: Sanity check cluster connection
        run: |
          echo "🧠 Checking current context and cluster connectivity…"
          kubectl config current-context
          kubectl get ns
          echo "✅ Cluster access verified."

      - name: Wipe selected namespaces
        run: |
          set -euo pipefail
          NAMESPACE="${{ inputs.namespace }}"

          if [[ "$NAMESPACE" == "both" ]]; then
            TARGET_NAMESPACES=("dev" "prod")
          else
            TARGET_NAMESPACES=("$NAMESPACE")
          fi

          for NS in "${TARGET_NAMESPACES[@]}"; do
            echo "🔄 Starting full wipe of namespace '${NS}'"
            kubectl delete ns "${NS}" --wait=false --ignore-not-found
            echo "⏳ Waiting for deletion of '${NS}' (up to 60s)…"

            for i in {1..30}; do
              sleep 2
              kubectl get ns "${NS}" &>/dev/null || {
                echo "✅ Namespace '${NS}' deleted."
                break
              }
              echo "  …still terminating"
            done

            if kubectl get ns "${NS}" &>/dev/null; then
              echo "⚠️ Namespace '${NS}' stuck in Terminating — inspecting finalizers"
              RAW_NS_JSON=$(kubectl get ns "${NS}" -o json || echo "")
              if [[ -n "${RAW_NS_JSON}" ]]; then
                echo "🔧 Removing finalizers from '${NS}'"
                echo "${RAW_NS_JSON}" \
                  | jq 'del(.spec.finalizers)' \
                  | kubectl replace --raw "/api/v1/namespaces/${NS}/finalize" -f -
                echo "🗑️ Namespace '${NS}' forced-deleted."
              else
                echo "❌ Unable to retrieve JSON for '${NS}'. Skipping finalizer removal."
              fi
            fi
          done

      - name: Clean up residual namespaced resources
        run: |
          echo "🧹 Checking for remaining namespaced resources tied to '${{ inputs.namespace }}'"

          if [[ "${{ inputs.namespace }}" == "both" ]]; then
            NS_LIST=("dev" "prod")
          else
            NS_LIST=("${{ inputs.namespace }}")
          fi

          for NS in "${NS_LIST[@]}"; do
            for kind in $(kubectl api-resources --namespaced=true --verbs=list -o name); do
              echo "  • Removing ${kind} in '${NS}'"
              kubectl delete "$kind" -n "${NS}" --all --wait --ignore-not-found || true
            done
          done

          echo "✅ Namespaced wipe completed."

      - name: Wipe cluster-scoped resources
        run: |
          set -euo pipefail
      
          echo "🗑️ Deleting all CustomResourceDefinitions (60s timeout)"
          kubectl delete crd --all --ignore-not-found --timeout=60s || true
      
          echo "🔍 Remaining CRDs after delete:"
          kubectl get crd --no-headers || echo "(none)"
      
          echo "🗑️ Deleting non-default ClusterRoles/Bindings"
          DEFAULT_ROLES=(cluster-admin admin edit view)
          for r in $(kubectl get clusterrole -o name); do
            name=${r#*/}
            [[ " ${DEFAULT_ROLES[*]} " =~ " ${name} " ]] || kubectl delete clusterrole "$name" --ignore-not-found --timeout=30s
          done
          for b in $(kubectl get clusterrolebinding -o name); do
            name=${b#*/}
            [[ " ${DEFAULT_ROLES[*]} " =~ " ${name} " ]] || kubectl delete clusterrolebinding "$name" --ignore-not-found --timeout=30s
          done
      
          echo "🔍 Remaining non-default ClusterRoles:"
          kubectl get clusterrole | grep -vE '^(NAME|admin|edit|view|system:|k3s-)' || echo "(none)"
      
          echo "🗑️ Deleting all webhooks and APIService definitions (30s timeout)"
          kubectl delete mutatingwebhookconfiguration,validatingwebhookconfiguration,apiservice --all --ignore-not-found --timeout=30s
      
          echo "🔍 Remaining webhooks/APIServices:"
          kubectl get mutatingwebhookconfiguration,validatingwebhookconfiguration,apiservice -o name || echo "(none)"
      
          echo "🗑️ Deleting all PersistentVolumes (30s timeout)"
          kubectl delete pv --all --ignore-not-found --timeout=30s
      
          echo "🔍 Remaining PVs:"
          kubectl get pv -o name || echo "(none)"
      
          echo "🗑️ Deleting non-default StorageClasses"
          kubectl get storageclass -o name \
            | grep -v 'local-path-storage' \
            | xargs -r kubectl delete --ignore-not-found --timeout=30s
      
          echo "🔍 Remaining StorageClasses:"
          kubectl get storageclass -o name || echo "(none)"
      
          echo "✅ Cluster-scoped wipe complete."
