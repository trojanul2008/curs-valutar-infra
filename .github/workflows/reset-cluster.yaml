name: "⚠️  Reset Cluster"

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Target namespace to wipe (dev, prod, or both)"
        required: true
        default: dev
      confirm:
        description: "Type YES to confirm deletion (required for prod or both, and for FULL)"
        required: false
        default: ""
      full:
        description: "Type FULL to also wipe cluster-scoped resources (CRDs, webhooks, PVs, etc.)"
        required: false
        default: ""
      dry_run:
        description: "true = only print actions; false = perform deletions"
        required: true
        default: "true"

# Avoid concurrent resets; this protects your cluster from overlapping destructive runs
concurrency:
  group: reset-cluster
  cancel-in-progress: false

# Principle of least privilege for the workflow token
permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional override via secret; else read from .github/versions.yaml
      KUBECTL_CONTEXT: ${{ secrets.KUBECTL_CONTEXT_OVERRIDE || '' }}
      # Optional Slack webhook for ops notifications (Incoming Webhook)
      # SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || '' }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]]; then
            echo "❌ Missing required secret: KUBE_CONFIG_DATA"
            exit 1
          fi

      - name: 🧠 Load versions and context from .github/versions.yaml
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          file=".github/versions.yaml"
          readv() { sed -n "s/^$1:[[:space:]]*//p" "$file" | tr -d '"' | tr -d $'\r'; }
          echo "kubectl=$(readv kubectl)" >> "$GITHUB_OUTPUT"
          echo "flux=$(readv flux)" >> "$GITHUB_OUTPUT"
          echo "yq=$(readv yq)" >> "$GITHUB_OUTPUT"
          echo "kustomize=$(readv kustomize)" >> "$GITHUB_OUTPUT"
          echo "kubeconform=$(readv kubeconform)" >> "$GITHUB_OUTPUT"
          echo "trivy=$(readv trivy)" >> "$GITHUB_OUTPUT"
          echo "context=$(readv KUBECTL_CONTEXT)" >> "$GITHUB_OUTPUT"

      - name: 🔧 Install CLI tools (version-pinned)
        shell: bash
        env:
          KUSTOMIZE_VERSION: ${{ steps.versions.outputs.kustomize }}
          KUBECONFORM_VERSION: ${{ steps.versions.outputs.kubeconform }}
          YQ_VERSION: ${{ steps.versions.outputs.yq }}
          TRIVY_VERSION: ${{ steps.versions.outputs.trivy }}
          KUBECTL_VERSION: ${{ steps.versions.outputs.kubectl }}
          FLUX_VERSION: ${{ steps.versions.outputs.flux }}
        run: |
          set -euo pipefail
          chmod +x scripts/install/install-all.sh
          scripts/install/install-all.sh
          kubectl version --client
          flux --version || true
          yq --version

      - name: 🗂️ Init audit log directory
        id: logs
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/reset-logs"
          mkdir -p "$LOG_DIR"
          echo "dir=$LOG_DIR" >> "$GITHUB_OUTPUT"

      - name: 🔐 Restore kubeconfig and validate context
        shell: bash
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/01_restore_kubeconfig.log"
          exec > >(tee -a "$LOG") 2>&1
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config

          CTX="${{ env.KUBECTL_CONTEXT }}"
          if [ -z "$CTX" ]; then
            CTX="${{ steps.versions.outputs.context }}"
          fi
          if [ -z "$CTX" ]; then
            echo "❌ No kube context provided (neither secret override nor versions.yaml)"
            exit 1
          fi

          echo "🔎 Validating context exists in kubeconfig: $CTX"
          if ! kubectl config get-contexts "$CTX" >/dev/null 2>&1; then
            echo "❌ Context $CTX not found in kubeconfig"
            echo "Available contexts:"
            kubectl config get-contexts || true
            exit 1
          fi

          kubectl config use-context "$CTX"
          echo "🔑 Current context: $(kubectl config current-context)"

          echo "🔗 Cluster connectivity check"
          kubectl cluster-info || true
          echo "👷 Nodes:"
          kubectl get nodes -o wide || true
          echo "🔐 RBAC preflight:"
          kubectl auth can-i list namespaces || true
          kubectl auth can-i delete namespaces || true

      - name: ✅ Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/02_validate_inputs.log"
          exec > >(tee -a "$LOG") 2>&1
          NS="${{ inputs.namespace }}"
          CONF="${{ inputs.confirm }}"
          FULL="${{ inputs.full }}"
          DRY="${{ inputs.dry_run }}"
          case "$NS" in dev|prod|both) ;; *) echo "❌ namespace must be dev|prod|both"; exit 1 ;; esac
          if [[ "$NS" != "dev" && "$CONF" != "YES" ]]; then
            echo "❌ Confirmation required (type YES) for prod or both"; exit 1
          fi
          if [[ "$FULL" == "FULL" && "$CONF" != "YES" ]]; then
            echo "❌ Confirmation required (type YES) for FULL wipe"; exit 1
          fi
          if [[ "$DRY" != "true" && "$DRY" != "false" ]]; then
            echo "❌ dry_run must be true or false"; exit 1
          fi
          echo "✅ Inputs OK: namespace=$NS full=$FULL dry_run=$DRY"

      - name: 📣 Echo dry-run mode
        run: 'echo 🟡 Dry-run mode enabled: no actual deletions performed'
        if: ${{ inputs.dry_run == 'true' }}

      - name: 📦 Ensure jq is available
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: 🛡️ Ensure cloudflare-user serviceaccount exists
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RBAC_NS: default
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/03_rbac_sa.log"
          exec > >(tee -a "$LOG") 2>&1
          NS="${RBAC_NS:-default}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would create serviceaccount cloudflare-user in $NS if missing"
          else
            kubectl -n "$NS" get sa cloudflare-user >/dev/null 2>&1 || kubectl -n "$NS" create sa cloudflare-user
          fi

      - name: 🛡️ Grant teardown-admin to cloudflare-user
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RBAC_NS: default
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/04_rbac_binding.log"
          exec > >(tee -a "$LOG") 2>&1
          NS="${RBAC_NS:-default}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would grant clusterrolebinding teardown-admin to $NS/cloudflare-user"
          else
            kubectl create clusterrolebinding teardown-admin \
              --clusterrole=cluster-admin \
              --serviceaccount="$NS:cloudflare-user" \
              --dry-run=client -o yaml | kubectl apply -f -
            # annotate with timestamp for traceability
            kubectl annotate clusterrolebinding teardown-admin reset.k8s.io/createdAt="$(date -u +%FT%TZ)" --overwrite
          fi

      - name: 🌐 Show API resources (debug)
        shell: bash
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/05_api_debug.log"
          exec > >(tee -a "$LOG") 2>&1
          kubectl api-resources | head -n 30 || true
          kubectl get ns || true

      - name: 💤 Suspend Flux reconciliation (pre-wipe)
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/06_flux_suspend.log"
          exec > >(tee -a "$LOG") 2>&1
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would suspend Flux Kustomizations/HelmReleases in flux-system, dev, prod"
          else
            for ns in flux-system dev prod; do
              if kubectl get ns "$ns" >/dev/null 2>&1; then
                flux suspend kustomization --all -n "$ns" || true
                flux suspend helmrelease --all -n "$ns" || true
              fi
            done
          fi

      - name: 🧹 Wipe namespaces and clean finalizers
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/07_wipe_namespaces.log"
          exec > >(tee -a "$LOG") 2>&1
          chmod +x scripts/reset/wipe-namespaces.sh scripts/reset/finalizer-cleanup.sh
          scripts/reset/wipe-namespaces.sh "${{ inputs.namespace }}" "${{ inputs.full }}" "$DRY_RUN"

      - name: 🧨 Strip CRD finalizers (when FULL)
        if: ${{ inputs.full == 'FULL' }}
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/08_crd_finalizers.log"
          exec > >(tee -a "$LOG") 2>&1
          for crd in $(kubectl get crd -o name); do
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY-RUN: would patch finalizers for $crd"
            else
              kubectl patch "$crd" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            fi
          done

      - name: 🧱 Cluster-scoped cleanup (when FULL)
        if: ${{ inputs.full == 'FULL' }}
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/09_cluster_scoped_cleanup.log"
          exec > >(tee -a "$LOG") 2>&1
          chmod +x scripts/reset/cluster-scoped-cleanup.sh
          scripts/reset/cluster-scoped-cleanup.sh "$DRY_RUN"

      - name: 🧽 Remove temporary clusterrolebinding
        if: always()
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/10_rbac_cleanup.log"
          exec > >(tee -a "$LOG") 2>&1
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would delete clusterrolebinding teardown-admin"
          else
            kubectl delete clusterrolebinding teardown-admin --ignore-not-found
          fi

      - name: ▶️ Resume Flux reconciliation (post-wipe)
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/11_flux_resume.log"
          exec > >(tee -a "$LOG") 2>&1
          # Resume only if flux-system still exists
          if kubectl get ns flux-system >/dev/null 2>&1; then
            for ns in flux-system dev prod; do
              if kubectl get ns "$ns" >/dev/null 2>&1; then
                flux resume kustomization --all -n "$ns" || true
                flux resume helmrelease --all -n "$ns" || true
              fi
            done
          else
            echo "Flux namespace not found; skipping resume."
          fi

      - name: 🧪 Sanity check post-reset
        shell: bash
        run: |
          set -euo pipefail
          LOG="${{ steps.logs.outputs.dir }}/12_sanity_check.log"
          exec > >(tee -a "$LOG") 2>&1
          echo "🧪 Namespaces:"
          kubectl get ns || true
          echo "🧪 CRDs:"
          kubectl get crd || true
          echo "🧪 Pods (non-Running):"
          kubectl get pods -A --field-selector=status.phase!=Running -o wide || true
          echo "✅ Cluster wipe completed."

      - name: 🧾 Package deletion logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reset-logs
          path: ${{ steps.logs.outputs.dir }}
          if-no-files-found: warn
          retention-days: 14
