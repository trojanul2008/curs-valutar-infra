name: 🚀 Reset & Bootstrap Infra

on:
  workflow_dispatch:
    inputs:
      confirm_prod_wipe:
        description: 'Type YES to confirm wiping production'
        required: false

env:
  KUSTOMIZE_VERSION: v5.0.2
  KUBECONFORM_VERSION: v0.6.4
  KYVERNO_VERSION: v1.12.4

jobs:
  reset-and-bootstrap:
    name: Reset Cluster & Flux Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore kubeconfig for remote access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
          kubectl config use-context remote-cloudflare

      - name: Verify remote cluster access
        run: |
          kubectl --context=remote-cloudflare get nodes

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Install Flux CLI
        run: curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Install Helm CLI
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Make wipe script executable
        run: chmod +x ./wipe-cluster.sh

      - name: Wipe dev cluster back to zero
        run: |
          ./wipe-cluster.sh --context remote-cloudflare --env dev

      - name: Conditionally wipe prod (on request only)
        if: ${{ github.event.inputs.confirm_prod_wipe == 'YES' }}
        run: |
          echo "⚠️ Wiping production cluster as requested"
          ./wipe-cluster.sh --context remote-cloudflare --env prod

      - name: Install Kyverno
        run: |
          kubectl --context=remote-cloudflare create ns kyverno || true
          kubectl --context=remote-cloudflare apply -f \
             https://raw.githubusercontent.com/kyverno/kyverno/main/config/release/install.yaml

      - name: Flux bootstrap to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flux bootstrap github \
            --context=remote-cloudflare \
            --owner=trojanul2008 \
            --repository=curs-valutar-infra \
            --branch=dev \
            --path=infrastructure/flux/flux-system/manifests \
            --personal
