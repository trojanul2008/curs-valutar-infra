name: "✅ PROD Deployment Verification"

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/k8s/base/**"
      - "infrastructure/k8s/overlays/prod/**"

permissions:
  contents: read

concurrency:
  group: prod-deployment
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify Argo CD PROD deployment"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kubernetes access CLI tools
        shell: bash
        run: |
          set -euo pipefail

          scripts/install/install-kubectl.sh
          scripts/install/install-cloudflared-access.sh

      - name: Restore Kubernetes access
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$KUBE_CONFIG_DATA" ]]; then
            echo "ERROR: KUBE_CONFIG_DATA is not configured."
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBE_CONFIG_DATA" \
            | base64 --decode \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

      - name: Start Kubernetes Access tunnel
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          scripts/access/start-k8s-api-proxy.sh

      - name: Wait for Argo CD deployment
        shell: bash
        run: |
          EXPECTED_REVISION="${GITHUB_SHA}"
          APP="curs-valutar-prod"

          echo "Expected Git revision: $EXPECTED_REVISION"

          for i in $(seq 1 60); do
            REVISION="$(
              kubectl \
                --context=remote-cloudflare \
                -n argocd \
                get application "$APP" \
                -o jsonpath='{.status.sync.revision}' 2>/dev/null || true
            )"

            SYNC="$(
              kubectl \
                --context=remote-cloudflare \
                -n argocd \
                get application "$APP" \
                -o jsonpath='{.status.sync.status}' 2>/dev/null || true
            )"

            HEALTH="$(
              kubectl \
                --context=remote-cloudflare \
                -n argocd \
                get application "$APP" \
                -o jsonpath='{.status.health.status}' 2>/dev/null || true
            )"

            echo \
              "revision=$REVISION sync=$SYNC health=$HEALTH"

            if [[ "$REVISION" == "$EXPECTED_REVISION" \
               && "$SYNC" == "Synced" \
               && "$HEALTH" == "Healthy" ]]; then
              echo "Argo CD deployed the expected PROD revision."
              exit 0
            fi

            sleep 2
          done

          echo "PROD deployment did not reach the expected state."

          kubectl \
            --context=remote-cloudflare \
            -n argocd \
            get application "$APP"

          exit 1

      - name: PROD HTTP smoke test
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            https://exchange.istartit.com \
            > /dev/null

          echo "PROD HTTP smoke test passed."

      - name: Stop Kubernetes Access tunnel
        if: always()
        shell: bash
        run: scripts/access/stop-k8s-api-proxy.sh
