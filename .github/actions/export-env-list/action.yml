name: "Export ENV_LIST + per-env mapping"
description: "Resolves ENV_LIST (from dev|prod|both) and exports CTX_*, BRANCH_*, PATH_* vars"
inputs:
  target:
    required: true
    description: "dev|prod|both"
outputs:
  list:
    description: "Space-separated list of envs"
    value: ${{ steps.export.outputs.list }}
runs:
  using: "composite"
  steps:
    - id: export
      shell: bash
      run: |
        set -euo pipefail

        command -v yq >/dev/null 2>&1 || { echo "❌ yq not found. Install tools before this step."; exit 1; }

        TARGET="${{ inputs.target }}"
        ENV_LIST="$TARGET"
        [[ "$TARGET" == "both" ]] && ENV_LIST="dev prod"

        echo "ENV_LIST=$ENV_LIST" >> "$GITHUB_ENV"

        file=".github/envs.yaml"
        read_env() {
          local env="$1" key="$2"
          yq ".environments.${env}.${key}" "$file" | tr -d '"' | tr -d $'\r'
        }

        echo "🔎 Environment resolution:"
        for ENV in $ENV_LIST; do
          BRANCH="$(read_env "$ENV" branch)"
          CTX="$(read_env "$ENV" kube_context)"
          PATH_VAL="$(read_env "$ENV" overlay_path)"

          if [[ -z "${BRANCH}" || "${BRANCH}" == "null" || -z "${CTX}" || "${CTX}" == "null" || -z "${PATH_VAL}" || "${PATH_VAL}" == "null" ]]; then
            echo "❌ Missing mapping for '$ENV' (branch/context/path)"
            exit 1
          fi

          echo "  • $ENV → branch=$BRANCH, context=$CTX, path=$PATH_VAL"

          echo "BRANCH_${ENV}=$BRANCH" >> "$GITHUB_ENV"
          echo "CTX_${ENV}=$CTX" >> "$GITHUB_ENV"
          echo "PATH_${ENV}=$PATH_VAL" >> "$GITHUB_ENV"
        done

        echo "list=$ENV_LIST" >> "$GITHUB_OUTPUT"
